name: Smart Build & Release

# ============================================================================
# Smart Update — only build plugins that actually changed.
# Every product builds on BOTH platforms: [win-only] / [mac-only] are no longer
# honoured (audit R127) - one version field covers both, so a one-platform
# build left the other platform on its old installer under the new number.
# No v* tag trigger (audit R132): a tag re-released every product. Never push
# v* tags. A dry run of any branch is Actions > Run workflow (below).
# ============================================================================
on:
  push:
    branches: [main]
  # Dry run (audit R128): builds, signs and packages the products named in
  # 'products' on both platforms and keeps the installers as run artefacts,
  # but never publishes - Release and Update versions.json run for a push only.
  # Pick a branch in the Run workflow menu to try its main.yml before main.
  workflow_dispatch:
    inputs:
      products:
        description: "Products to build: comma-separated ids (stutter,stucker,throw,clipper,rise,iron,control,rone1176,rone2a,flanger,reverse_reverb,afterspace,analyzer,plugins_center) or 'all'"
        required: true
        default: stutter

# Read-only by default. Only 'release' gets contents: write (gh release
# upload/edit/create). update-manifest pushes versions.json with GH_PAT
# (checkout token + insteadOf), not with the job token, so it stays read-only.
# Every action is pinned to a full commit SHA (tag in the comment).
permissions:
  contents: read

# Deliberately NO workflow-level concurrency group: GitHub cancels a PENDING
# run when a third push queues, and the path filter only diffs each push's own
# commits, so the cancelled run's plugins would never be built. Older runs
# finishing last are stopped by scripts/ci/release-guard.sh instead.

jobs:
  # ================================================================
  # 1. DETECT CHANGES — output dynamic build matrices
  # ================================================================
  detect-changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      matrix_windows: ${{ steps.matrix.outputs.windows }}
      matrix_macos:   ${{ steps.matrix.outputs.macos }}
      has_windows:    ${{ steps.matrix.outputs.has_windows }}
      has_macos:      ${{ steps.matrix.outputs.has_macos }}
      changed:        ${{ steps.matrix.outputs.changed }}
      skip_validate:  ${{ steps.matrix.outputs.skip_validate }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 2
          submodules: false

      # Shared/tests/** and Shared/check-vendored-copies.sh never ship, so they
      # rebuild nothing (Shared review, finding 4). dorny/paths-filter ORs a
      # filter's patterns: a plain '!Shared/tests/**' line would match every
      # other file of the push and rebuild every product. The exclusion is
      # therefore written inside three positive patterns (picomatch extglobs,
      # checked against picomatch 2.3 and 4.0 with dot: true):
      #   'Shared/!(tests|check-vendored-copies.sh)'  a file directly in Shared/
      #   'Shared/!(tests|RoneControlRack)/**/*'      a file in a subfolder whose
      #                                               name is neither 'tests' nor
      #                                               'RoneControlRack'
      #   'Shared/tests?*/**/*'                       ...or is longer than 'tests'
      #   'Shared/RoneControlRack?*/**/*'             ...or longer than 'RoneControlRack'
      # (picomatch's !(x) before a '/' also refuses 'xY', hence the re-admitting lines.)
      # Shared/RoneControlRack/** (RONE Control's hands + the rack, 26.10.2026) is
      # compiled only by the plugins that take the rack: a change there rebuilds
      # nothing by itself. A plugin that takes the rack adds
      #   - 'Shared/RoneControlRack/**'
      # to ITS filter that day, so a rack fix ships with that plugin's next release.
      # Every other Shared/ path matches exactly as 'Shared/**' did.
      - name: Path filter
        if: github.event_name == 'push'
        uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3
        id: filter
        with:
          filters: |
            reverse_reverb:
              - 'ReverseReverbVST'
              - 'Shared/!(tests|check-vendored-copies.sh)'
              - 'Shared/!(tests|RoneControlRack)/**/*'
              - 'Shared/tests?*/**/*'
              - 'Shared/RoneControlRack?*/**/*'
              - 'installer/ReverseReverb.iss'
              - 'docs/manuals/RONE Reverse Reverb - User Manual.pdf'
              - '.github/workflows/main.yml'
            stems_fixer:
              - 'RoneStemsFixer'
              - 'Shared/!(tests|check-vendored-copies.sh)'
              - 'Shared/!(tests|RoneControlRack)/**/*'
              - 'Shared/tests?*/**/*'
              - 'Shared/RoneControlRack?*/**/*'
              - 'installer/RoneStemsFixer.iss'
              - '.github/workflows/main.yml'
            stutter:
              - 'RoneStutter'
              - 'Shared/!(tests|check-vendored-copies.sh)'
              - 'Shared/!(tests|RoneControlRack)/**/*'
              - 'Shared/tests?*/**/*'
              - 'Shared/RoneControlRack?*/**/*'
              - 'installer/RoneStutter.iss'
              - 'docs/manuals/RONE Stutter - User Manual.pdf'
              - '.github/workflows/main.yml'
            stucker:
              - 'RoneStucker'
              - 'Shared/!(tests|check-vendored-copies.sh)'
              - 'Shared/!(tests|RoneControlRack)/**/*'
              - 'Shared/tests?*/**/*'
              - 'Shared/RoneControlRack?*/**/*'
              - 'installer/RoneStucker.iss'
              - 'docs/manuals/RONE Stucker - User Manual.pdf'
              - '.github/workflows/main.yml'
            throw:
              - 'RoneThrow'
              - 'Shared/!(tests|check-vendored-copies.sh)'
              - 'Shared/!(tests|RoneControlRack)/**/*'
              - 'Shared/tests?*/**/*'
              - 'Shared/RoneControlRack?*/**/*'
              - 'installer/RoneThrow.iss'
              - 'docs/manuals/RONE Throw - User Manual.pdf'
              - '.github/workflows/main.yml'
            clipper:
              - 'RoneClipper'
              - 'Shared/!(tests|check-vendored-copies.sh)'
              - 'Shared/!(tests|RoneControlRack)/**/*'
              - 'Shared/tests?*/**/*'
              - 'Shared/RoneControlRack?*/**/*'
              - 'installer/RoneClipper.iss'
              - 'docs/manuals/RONE Clipper - User Manual.pdf'
              - '.github/workflows/main.yml'
            rise:
              - 'RoneRise'
              - 'Shared/!(tests|check-vendored-copies.sh)'
              - 'Shared/!(tests|RoneControlRack)/**/*'
              - 'Shared/tests?*/**/*'
              - 'Shared/RoneControlRack?*/**/*'
              - 'installer/RoneRise.iss'
              - 'docs/manuals/RONE Rise - User Manual.pdf'
              - '.github/workflows/main.yml'
            iron:
              - 'RoneIron'
              - 'Shared/!(tests|check-vendored-copies.sh)'
              - 'Shared/!(tests|RoneControlRack)/**/*'
              - 'Shared/tests?*/**/*'
              - 'Shared/RoneControlRack?*/**/*'
              - 'installer/RoneIron.iss'
              - 'docs/manuals/RONE Iron - User Manual.pdf'
              - '.github/workflows/main.yml'
            control:
              - 'RoneControl'
              - 'Shared/!(tests|check-vendored-copies.sh)'
              - 'Shared/!(tests|RoneControlRack)/**/*'
              - 'Shared/tests?*/**/*'
              - 'Shared/RoneControlRack?*/**/*'
              # RONE Control compiles its hands layer from Shared/RoneControlRack (the only product that does, until a rack ships)
              - 'Shared/RoneControlRack/**'
              - 'installer/RoneControl.iss'
              - 'docs/manuals/RONE Control - User Manual.pdf'
              - '.github/workflows/main.yml'
            rone1176:
              - 'Rone1176'
              - 'Shared/!(tests|check-vendored-copies.sh)'
              - 'Shared/!(tests|RoneControlRack)/**/*'
              - 'Shared/tests?*/**/*'
              - 'Shared/RoneControlRack?*/**/*'
              - 'installer/Rone1176.iss'
              - 'docs/manuals/RONE 1176 - User Manual.pdf'
              - '.github/workflows/main.yml'
            rone2a:
              - 'Rone2A'
              - 'Shared/!(tests|check-vendored-copies.sh)'
              - 'Shared/!(tests|RoneControlRack)/**/*'
              - 'Shared/tests?*/**/*'
              - 'Shared/RoneControlRack?*/**/*'
              - 'installer/Rone2A.iss'
              - 'docs/manuals/RONE 2A - User Manual.pdf'
              - '.github/workflows/main.yml'
            flanger:
              - 'rone-flanger-'
              - 'Shared/!(tests|check-vendored-copies.sh)'
              - 'Shared/!(tests|RoneControlRack)/**/*'
              - 'Shared/tests?*/**/*'
              - 'Shared/RoneControlRack?*/**/*'
              - 'installer/RoneFlanger.iss'
              - 'docs/manuals/RONE Flanger - User Manual.pdf'
              - '.github/workflows/main.yml'
            sync_verb:
              - 'rone sync verb'
              - 'Shared/!(tests|check-vendored-copies.sh)'
              - 'Shared/!(tests|RoneControlRack)/**/*'
              - 'Shared/tests?*/**/*'
              - 'Shared/RoneControlRack?*/**/*'
              - 'installer/RoneSyncVerb.iss'
              - 'docs/manuals/RONE Sync Verb - User Manual.pdf'
              - '.github/workflows/main.yml'
            afterspace:
              - 'RONE AFTER SPACE/**'
              - 'Shared/!(tests|check-vendored-copies.sh)'
              - 'Shared/!(tests|RoneControlRack)/**/*'
              - 'Shared/tests?*/**/*'
              - 'Shared/RoneControlRack?*/**/*'
              - 'installer/RoneAfterspace.iss'
              - 'docs/manuals/RONE AFTERSPACE - User Manual.pdf'
              - '.github/workflows/main.yml'
            analyzer:
              - 'RONEAnalyzer'
              - 'installer/RONEAnalyzer.iss'
              - 'docs/manuals/RONE Analyzer - User Manual.pdf'
              - '.github/workflows/main.yml'
            plugins_center:
              - 'RonePluginsCenter/**'
              - 'Shared/!(tests|check-vendored-copies.sh)'
              - 'Shared/!(tests|RoneControlRack)/**/*'
              - 'Shared/tests?*/**/*'
              - 'Shared/RoneControlRack?*/**/*'
              - 'installer/RONE_Plugins.iss'
              - 'installer/mac/**'
              - 'scripts/ci/make-center-dmg.sh'
              - '.github/workflows/main.yml'

      - name: Generate build matrices
        id: matrix
        shell: bash
        env:
          EVENT:             ${{ github.event_name }}
          DISPATCH_PRODUCTS: ${{ github.event.inputs.products }}
        run: |
          MSG=$(git log -1 --format=%s)

          # [win-only] / [mac-only] are retired (audit R127): both platforms always
          # build. Only a warning - failing here would drop this push's changes for
          # good, because the path filter only diffs each push's own commits.
          SKIP_WIN=false; SKIP_MAC=false
          if [[ "$MSG" == *"[mac-only]"* || "$MSG" == *"[win-only]"* ]]; then
            echo "::warning::[win-only]/[mac-only] is no longer honoured - one version field covers both platforms (audit R127); building both"
          fi

          # [skip-validate] in the subject: pluginval and auval do not run (audit
          # R133). They only warn today; this is the way past them once they block.
          SKIP_VALIDATE=false
          if [[ "$MSG" == *"[skip-validate]"* ]]; then SKIP_VALIDATE=true; fi

          # Change flags: what the path filter saw in this push...
          RR=${{ steps.filter.outputs.reverse_reverb || 'false' }}
          SF=${{ steps.filter.outputs.stems_fixer    || 'false' }}
          ST=${{ steps.filter.outputs.stutter         || 'false' }}
          SK=${{ steps.filter.outputs.stucker         || 'false' }}
          TH=${{ steps.filter.outputs.throw           || 'false' }}
          CL=${{ steps.filter.outputs.clipper         || 'false' }}
          RI=${{ steps.filter.outputs.rise            || 'false' }}
          IR=${{ steps.filter.outputs.iron            || 'false' }}
          CT=${{ steps.filter.outputs.control         || 'false' }}
          C76=${{ steps.filter.outputs.rone1176       || 'false' }}
          C2A=${{ steps.filter.outputs.rone2a         || 'false' }}
          FL=${{ steps.filter.outputs.flanger         || 'false' }}
          SV=${{ steps.filter.outputs.sync_verb       || 'false' }}
          PC=${{ steps.filter.outputs.plugins_center  || 'false' }}
          AN=${{ steps.filter.outputs.analyzer        || 'false' }}
          AS=${{ steps.filter.outputs.afterspace      || 'false' }}

          # ...or what a dry run names (workflow_dispatch, audit R128). Release and
          # Update versions.json never run for one.
          if [ "$EVENT" = "workflow_dispatch" ]; then
            want=",$(printf '%s' "$DISPATCH_PRODUCTS" | tr -d ' ' | tr 'A-Z' 'a-z'),"
            for p in $(printf '%s' "$want" | tr ',' ' '); do
              case "$p" in
                all|reverse_reverb|stems_fixer|stutter|stucker|throw|clipper|rise|iron|control|rone1176|rone2a|flanger|sync_verb|afterspace|plugins_center|analyzer) ;;
                *) echo "::error::dry run: unknown product '$p'"; exit 1 ;;
              esac
            done
            pick() { case "$want" in *,all,*|*",$1,"*) echo true ;; *) echo false ;; esac; }
            RR=$(pick reverse_reverb); SF=$(pick stems_fixer); ST=$(pick stutter); SK=$(pick stucker)
            TH=$(pick throw); CL=$(pick clipper); RI=$(pick rise); IR=$(pick iron); CT=$(pick control); FL=$(pick flanger)
            C76=$(pick rone1176); C2A=$(pick rone2a)
            SV=$(pick sync_verb); PC=$(pick plugins_center); AN=$(pick analyzer); AS=$(pick afterspace)
            echo "dry run, nothing is published: $DISPATCH_PRODUCTS"
          fi

          win='[]'; mac='[]'; changed='[]'

          add() {
            local flag=$1 id=$2 folder=$3 cmake=$4 tag=$5 inst=$6 wv=$7 wvf=${8:-} flg=$9 iss=${10} manual=${11:-} legacy=${12:-}
            [ "$flag" != "true" ] && return
            changed=$(echo "$changed" | jq -c ". + [\"$id\"]")
            local e
            e=$(jq -nc \
              --arg plugin_id      "$id"     \
              --arg folder         "$folder" \
              --arg cmake_project  "$cmake"  \
              --arg release_tag    "$tag"    \
              --arg installer_name "$inst"   \
              --arg needs_webview2 "$wv"     \
              --arg webview2_flag  "$wvf"    \
              --arg is_flanger     "$flg"    \
              --arg iss_file       "$iss"    \
              --arg manual_pdf     "$manual" \
              --arg legacy_name    "$legacy" \
              '$ARGS.named')
            [ "$SKIP_WIN" != "true" ] && win=$(echo "$win" | jq -c ". + [$e]")
            [ "$SKIP_MAC" != "true" ] && mac=$(echo "$mac" | jq -c ". + [$e]")
          }

          #        flag  id                folder              cmake             release-tag               installer-name        wv     wv-flag                           flanger  iss                 manual (docs/manuals)                   legacy name (pre-#155)
          add "$RR" reverse_reverb  ReverseReverbVST  ReverseReverb     ReverseReverb-latest      ReverseReverb             true   JUCE_WEBVIEW2_PACKAGE_LOCATION    false    ReverseReverb.iss   "RONE Reverse Reverb - User Manual.pdf" "ReverseReverb"
          # shelved 2026-08-31 (Liran): Stems is out of the bundle for now - uncomment to bring it back
          #add "$SF" stems_fixer     RoneStemsFixer     RoneStemsFixer    RoneStemsFixer-latest      RoneStemsFixer             false  ""                                false    RoneStemsFixer.iss
          add "$ST" stutter         RoneStutter        RoneStutter       RoneStutter-latest         RoneStutter               true   FETCHCONTENT_SOURCE_DIR_WEBVIEW2  false    RoneStutter.iss     "RONE Stutter - User Manual.pdf"        "Rone Stutter"
          add "$SK" stucker         RoneStucker        RoneStucker       RoneStucker-latest         RoneStucker               true   FETCHCONTENT_SOURCE_DIR_WEBVIEW2  false    RoneStucker.iss     "RONE Stucker - User Manual.pdf"        "Rone Stucker"
          add "$TH" throw           RoneThrow          RoneThrow         RoneThrow-latest           RoneThrow                 true   FETCHCONTENT_SOURCE_DIR_WEBVIEW2  false    RoneThrow.iss       "RONE Throw - User Manual.pdf"          ""
          add "$CL" clipper         RoneClipper        RoneClipper       RoneClipper-latest         RoneClipper               true   FETCHCONTENT_SOURCE_DIR_WEBVIEW2  false    RoneClipper.iss     "RONE Clipper - User Manual.pdf"        ""
          add "$RI" rise            RoneRise           RoneRise          RoneRise-latest            RoneRise                  true   FETCHCONTENT_SOURCE_DIR_WEBVIEW2  false    RoneRise.iss        "RONE Rise - User Manual.pdf"           ""
          add "$IR" iron            RoneIron           RoneIron          RoneIron-latest            RoneIron                  true   FETCHCONTENT_SOURCE_DIR_WEBVIEW2  false    RoneIron.iss        "RONE Iron - User Manual.pdf"           ""
          add "$CT" control         RoneControl        RoneControl       RoneControl-latest         RoneControl               true   JUCE_WEBVIEW2_PACKAGE_LOCATION    false    RoneControl.iss     "RONE Control - User Manual.pdf"        ""
          add "$C76" rone1176       Rone1176           Rone1176          Rone1176-latest            Rone1176                  true   JUCE_WEBVIEW2_PACKAGE_LOCATION    false    Rone1176.iss        "RONE 1176 - User Manual.pdf"           ""
          add "$C2A" rone2a         Rone2A             Rone2A            Rone2A-latest              Rone2A                    true   JUCE_WEBVIEW2_PACKAGE_LOCATION    false    Rone2A.iss          "RONE 2A - User Manual.pdf"             ""
          add "$FL" flanger         rone-flanger-      ManualFlanger     RoneFlanger-latest         RoneFlanger               true   JUCE_WEBVIEW2_PACKAGE_LOCATION    true     RoneFlanger.iss     "RONE Flanger - User Manual.pdf"        "Rone Flanger"
          # shelved 2026-08-31 (Liran): Sync Verb is out of the bundle for now - uncomment to bring it back
          #add "$SV" sync_verb      "rone sync verb"   RoneSyncVerb      RoneSyncVerb-latest        RoneSyncVerb              true   FETCHCONTENT_SOURCE_DIR_WEBVIEW2  false    RoneSyncVerb.iss    "RONE Sync Verb - User Manual.pdf"      "Rone Sync Verb"
          add "$AS" afterspace    "RONE AFTER SPACE" RoneAfterspace    RoneAfterspace-latest      RoneAfterspace            true   FETCHCONTENT_SOURCE_DIR_WEBVIEW2  false    RoneAfterspace.iss  "RONE AFTERSPACE - User Manual.pdf"     ""
          add "$PC" plugins_center  RonePluginsCenter  RonePluginsCenter PluginsCenter-latest       RONE_Plugins_Center       true   JUCE_WEBVIEW2_PACKAGE_LOCATION   false    RONE_Plugins.iss
          add "$AN" analyzer        RONEAnalyzer       RONEAnalyzer      RONEAnalyzer-latest        RONEAnalyzer              true   JUCE_WEBVIEW2_PACKAGE_LOCATION    false    RONEAnalyzer.iss    "RONE Analyzer - User Manual.pdf"       ""

          echo "windows=$win"     >> $GITHUB_OUTPUT
          echo "macos=$mac"       >> $GITHUB_OUTPUT
          echo "has_windows=$([ "$win" != '[]' ] && echo true || echo false)" >> $GITHUB_OUTPUT
          echo "has_macos=$([ "$mac" != '[]' ] && echo true || echo false)"   >> $GITHUB_OUTPUT
          echo "changed=$changed" >> $GITHUB_OUTPUT
          echo "skip_validate=$SKIP_VALIDATE" >> $GITHUB_OUTPUT

          # Summary
          echo "### Smart Build" >> $GITHUB_STEP_SUMMARY
          echo "| Platform | Plugins |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|---------|" >> $GITHUB_STEP_SUMMARY
          echo "| Windows  | $(echo $win | jq -r '[.[].plugin_id] | join(", ") // "—"') |" >> $GITHUB_STEP_SUMMARY
          echo "| macOS    | $(echo $mac | jq -r '[.[].plugin_id] | join(", ") // "—"') |" >> $GITHUB_STEP_SUMMARY

  # ================================================================
  # 2. BUILD + PACKAGE WINDOWS
  # ================================================================
  build-windows:
    name: "Win: ${{ matrix.plugin_id }}"
    needs: detect-changes
    if: needs.detect-changes.outputs.has_windows == 'true'
    runs-on: windows-latest
    env:
      # Code signing (docs/CODE-SIGNING.md). All optional: without them the
      # build is produced unsigned. First complete set wins, see scripts/ci/sign-windows.ps1.
      AZURE_TENANT_ID:       ${{ secrets.AZURE_TENANT_ID }}
      AZURE_CLIENT_ID:       ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_CLIENT_SECRET:   ${{ secrets.AZURE_CLIENT_SECRET }}
      ACS_ENDPOINT:          ${{ secrets.ACS_ENDPOINT }}
      ACS_ACCOUNT:           ${{ secrets.ACS_ACCOUNT }}
      ACS_PROFILE:           ${{ secrets.ACS_PROFILE }}
      ESIGNER_USERNAME:      ${{ secrets.ESIGNER_USERNAME }}
      ESIGNER_PASSWORD:      ${{ secrets.ESIGNER_PASSWORD }}
      ESIGNER_CREDENTIAL_ID: ${{ secrets.ESIGNER_CREDENTIAL_ID }}
      ESIGNER_TOTP_SECRET:   ${{ secrets.ESIGNER_TOTP_SECRET }}
      WIN_SIGN_PFX_BASE64:   ${{ secrets.WIN_SIGN_PFX_BASE64 }}
      WIN_SIGN_PFX_PASSWORD: ${{ secrets.WIN_SIGN_PFX_PASSWORD }}
      # No GITHUB_TOKEN here (audit R051): only the two steps that run
      # sign-windows.ps1 get it (it reads the CodeSignTool release with it).
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.detect-changes.outputs.matrix_windows) }}

    steps:
      # Before the build cache is restored: anything in the artefacts folder
      # older than this file did not come from this job's build (audit R129).
      - name: Mark job start
        shell: pwsh
        run: New-Item -ItemType File -Force -Path (Join-Path $env:RUNNER_TEMP 'job-start') | Out-Null

      # --- Checkout ---
      # Audit R027: GH_PAT reaches only the submodule fetch below. The checkout
      # runs with the job token and leaves no credential in .git/config, and the
      # PAT's insteadOf rule is removed again before any third-party step
      # (toolchain set-up, caches, downloads, pluginval, the build) runs.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: false
          persist-credentials: false

      - name: Init submodule — ${{ matrix.folder }}
        shell: bash
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          FOLDER: ${{ matrix.folder }}
        run: |
          # AFTERSPACE lives in-repo (not a submodule) - tolerate that case
          if ! git ls-files --stage -- "$FOLDER" | awk '$1 == "160000" { s = 1 } END { exit !s }'; then
            echo "::notice::$FOLDER is not a submodule (in-repo sources)"
            exit 0
          fi
          rule="url.https://${GH_PAT}@github.com/.insteadOf"
          trap 'git config --global --unset-all "$rule" || true' EXIT
          git config --global "$rule" "https://github.com/"
          for i in 1 2 3; do
            if git submodule update --init --depth 1 -- "$FOLDER"; then exit 0; fi
            echo "::warning::submodule $FOLDER could not be fetched (try $i)"
            sleep $((10 * i))
          done
          echo "::error::submodule $FOLDER could not be fetched after 3 tries"
          exit 1

      # RONE Control carries Google's MediaPipe hand model as Windows resources (RoneControl/CMakeLists.txt
      # fails without the files; they are not in git). SHA-256 checked by the script.
      - name: Hand model — RONE Control
        if: matrix.plugin_id == 'control'
        working-directory: ${{ matrix.folder }}
        shell: bash
        run: python tools/fetch_mediapipe.py

      # --- MSVC ---
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
        with: { arch: x64 }

      # --- Caches ---
      - name: Build cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ matrix.folder }}/build-ci
          key:  build-${{ matrix.plugin_id }}-win-${{ hashFiles(format('{0}/CMakeLists.txt', matrix.folder)) }}-${{ github.sha }}
          restore-keys: build-${{ matrix.plugin_id }}-win-${{ hashFiles(format('{0}/CMakeLists.txt', matrix.folder)) }}-

      - name: WebView2 cache
        if: matrix.needs_webview2 == 'true'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        id: wv-cache
        with:
          path: ${{ github.workspace }}\webview2
          key:  webview2-nuget-1.0.1901.177

      - name: Download WebView2
        if: matrix.needs_webview2 == 'true' && steps.wv-cache.outputs.cache-hit != 'true'
        run: nuget install Microsoft.Web.WebView2 -Version 1.0.1901.177 -OutputDirectory "${{ github.workspace }}\webview2"

      - name: JUCE extras cache (flanger)
        if: matrix.is_flanger == 'true'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        id: extras-cache
        with:
          path: rone-flanger-/JUCE/extras/Build
          key:  flanger-juce-extras-8.0.12-win

      - name: Fetch JUCE extras (flanger)
        if: matrix.is_flanger == 'true' && steps.extras-cache.outputs.cache-hit != 'true'
        working-directory: rone-flanger-
        shell: pwsh
        run: |
          git clone --depth 1 --branch 8.0.12 --filter=blob:none --sparse https://github.com/juce-framework/JUCE.git _tmp
          Push-Location _tmp; git sparse-checkout set extras/Build; Pop-Location
          Copy-Item -Recurse -Force _tmp/extras/Build JUCE/extras/Build
          Remove-Item -Recurse -Force _tmp

      # --- Build ---
      - name: ASIO SDK (analyzer)
        if: matrix.plugin_id == 'analyzer'
        shell: pwsh
        run: |
          # Steinberg's SDK, fetched at build time - it may not live in the
          # repository, but a distributed analyzer without ASIO cannot talk
          # to the very interfaces it was built to measure.
          Invoke-WebRequest -Uri "https://www.steinberg.net/asiosdk" -OutFile asiosdk.zip
          Expand-Archive asiosdk.zip -DestinationPath asiosdk_root -Force
          $common = Get-ChildItem asiosdk_root -Recurse -Directory -Filter common | Select-Object -First 1
          if (-not $common) { Write-Error "ASIO SDK layout unexpected"; exit 1 }
          # Audit R130: the download is not pinned. The sources the analyzer
          # compiles (common/) are compared with ASIO SDK 2.3.4 as last checked;
          # a difference only warns for now - docs/CI-RELEASE.md has the step
          # that makes it an error once a run shows they match.
          Write-Host "asiosdk.zip sha256 $((Get-FileHash asiosdk.zip -Algorithm SHA256).Hash.ToLower())"
          $asioExpected = [ordered]@{
            'asio.cpp'        = '4ecee2bfaebd8b0777db96175d2b2ea8d0cd684dfaf9651480c44b0ebec0fd61'
            'asio.h'          = '93d2f80d49b4ac9c963514e7c1307ab5111d8104246192233745beb058534ea1'
            'asiodrvr.cpp'    = '47cf72e30cc04bc37fe609a467f833e85434f76b27b9cd19186358e4c50a6982'
            'asiodrvr.h'      = 'ca2d65191d4914cb405b5c0b9e0af932195b2734e8781cd4d8c94e6526fb8926'
            'asiosys.h'       = 'f44a1ed0fd7c056ff047aeebc4c05a8c185f0585a24d8debc55c70107777dbef'
            'combase.cpp'     = '1f8ef8b79de26c0435ff6544352af36327643421491c353b059d86e0e344cd23'
            'combase.h'       = '29d1ccf49c332fdcdc7abddb32f5adf9d475198eb0283b2ca19c450f35222b21'
            'debugmessage.cpp'= '5f0d92d18695f4b7847aed3a2108bfb552ffa5e17dbd20440eac0fbf32a04d62'
            'dllentry.cpp'    = 'f7b813e0d6191f0c973409780c3305e6ba1e72e3e6e5cf8f5125e7decdf589a2'
            'iasiodrv.h'      = '86ad4788452c74823653cf57d4bd557c48bb6542d7e6eb7fff80102c705a066d'
            'register.cpp'    = 'b1a09ddd5245f336ee9c1a0a38099cf146daff5212990a052245e14d5798e22d'
            'wxdebug.h'       = 'b4c7293a3c7b8cdf6dd19ce7ae5766674d7f581522bd508dc6e6d6b0384785da'
          }
          $asioDiff = 0
          foreach ($k in $asioExpected.Keys) {
            $f = Join-Path $common.FullName $k
            $h = if (Test-Path $f) { (Get-FileHash $f -Algorithm SHA256).Hash.ToLower() } else { 'missing' }
            if ($h -ne $asioExpected[$k]) { $asioDiff++; Write-Host "::warning::ASIO SDK common/$k is $h, not the 2.3.4 file checked before ($($asioExpected[$k]))" }
          }
          if ($asioDiff -eq 0) { Write-Host "ASIO SDK common/ is the 2.3.4 checked before ($($asioExpected.Count) files)" }
          "RONE_ASIO_SDK_ROOT=$($common.Parent.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "ASIO common dir: $($common.FullName)"

      - name: CMake configure
        working-directory: ${{ matrix.folder }}
        shell: pwsh
        run: |
          # Use Ninja with the MSVC toolchain set up by msvc-dev-cmd, so the build
          # doesn't depend on a specific Visual Studio generator version (the runner
          # image moves between VS 2022/18/… over time).
          $flags = @("-B","build-ci","-G","Ninja","-DCMAKE_BUILD_TYPE=Release")
          if ($env:RONE_ASIO_SDK_ROOT) {
            # The documented interface: the SDK *root*, and a hard requirement -
            # the first attempt passed an internal variable the CMakeLists
            # clobbers, and a WASAPI-only build sailed into the installer with
            # nothing but a warning. Now that mistake fails the build.
            $flags += "-DASIO_SDK_DIR=$env:RONE_ASIO_SDK_ROOT"
            $flags += "-DRONE_REQUIRE_ASIO=1"
          }
          if ("${{ matrix.needs_webview2 }}" -eq "true") {
            $flags += "-DJUCE_WEBVIEW2_PACKAGE_LOCATION=${{ github.workspace }}\webview2"
            # Explicit include path — guarantees WebView2.h is found even for juce_add_gui_app targets
            $wv2Include = "${{ github.workspace }}\webview2\Microsoft.Web.WebView2.1.0.1901.177\build\native\include"
            $flags += "-DCMAKE_CXX_FLAGS=/I`"$wv2Include`""
          }
          # Crash reports go through roneaudio.com/api/v1/crash since Center 2.0;
          # no token is compiled into any binary.
          cmake @flags
          if ($LASTEXITCODE -ne 0) {
            # A restored build cache can pin a Visual Studio instance that no longer
            # exists after a runner-image update. Wipe and reconfigure from scratch.
            Write-Host "Configure failed (stale build cache?). Wiping build-ci and retrying clean..."
            Remove-Item -Recurse -Force build-ci -ErrorAction SilentlyContinue
            cmake @flags
            if ($LASTEXITCODE -ne 0) { exit 1 }
          }

      - name: Verify WebView2 header
        if: matrix.needs_webview2 == 'true'
        shell: pwsh
        run: |
          Write-Host "=== Searching for WebView2.h ==="
          Get-ChildItem -Path "${{ github.workspace }}\webview2" -Recurse -Filter "WebView2.h" | Select-Object FullName
          $headerPath = "${{ github.workspace }}\webview2\Microsoft.Web.WebView2.1.0.1901.177\build\native\include\WebView2.h"
          if (Test-Path $headerPath) {
            Write-Host "WebView2.h confirmed at $headerPath"
          } else {
            Write-Error "WebView2.h NOT found at $headerPath"
            Get-ChildItem "${{ github.workspace }}\webview2" -Recurse -Depth 4 | Select-Object FullName
            exit 1
          }

      - name: CMake build
        working-directory: ${{ matrix.folder }}
        run: cmake --build build-ci --config Release --parallel

      # Log only (audit R129): a binary older than this job came out of the
      # restored build cache, not this build - the suspected cause of #147.
      # Nothing is deleted or failed yet; docs/CI-RELEASE.md has the next stage.
      - name: Stale binary check (log only)
        continue-on-error: true
        timeout-minutes: 5
        shell: pwsh
        run: |
          $start = (Get-Item (Join-Path $env:RUNNER_TEMP 'job-start')).LastWriteTimeUtc
          $dir = "${{ matrix.folder }}/build-ci/${{ matrix.cmake_project }}_artefacts/Release"
          if (-not (Test-Path $dir)) { Write-Host "no $dir - nothing to check"; exit 0 }
          $stale = @(Get-ChildItem $dir -Recurse -File -Include *.exe,*.vst3,*.dll | Where-Object { $_.LastWriteTimeUtc -lt $start })
          foreach ($f in $stale) { Write-Host "::warning::stale binary, older than this job (build cache?): $($f.FullName) $($f.LastWriteTimeUtc.ToString('u'))" }
          Write-Host "$($stale.Count) binaries older than this job in $dir"

      # --- Code signing (Authenticode) - a no-op until the secrets exist ---
      - name: Sign binaries
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $backend = (& scripts/ci/sign-windows.ps1 -Status | Select-Object -Last 1)
          "RONE_SIGN_BACKEND=$backend" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Windows signing backend: $backend"
          if ($backend -ne 'none') {
            & scripts/ci/sign-windows.ps1 -Require "${{ matrix.folder }}/build-ci/${{ matrix.cmake_project }}_artefacts/Release"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      # --- pluginval (VST3 sanity check) - warns, never fails the build ---
      # Audit R133: '&' on the GUI-subsystem pluginval.exe did not wait for it,
      # so the step took 1-2 s and validated nothing. Start-Process waits (20
      # minutes at most per bundle), every .vst3 is checked rather than the first
      # one, and the log and the exit code are printed. [skip-validate] in the
      # commit subject skips it.
      - name: Run pluginval
        if: matrix.plugin_id != 'plugins_center' && matrix.plugin_id != 'stems_fixer' && needs.detect-changes.outputs.skip_validate != 'true'
        continue-on-error: true
        timeout-minutes: 45
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          $zip = "pluginval.zip"
          for ($i = 1; $i -le 3; $i++) {
            try { Invoke-WebRequest -Uri "https://github.com/Tracktion/pluginval/releases/download/v1.0.3/pluginval_Windows.zip" -OutFile $zip -ErrorAction Stop; break }
            catch { Remove-Item $zip -ErrorAction SilentlyContinue; Write-Host "::warning::pluginval download failed (try $i): $_"; Start-Sleep -Seconds (5 * $i) }
          }
          if (-not (Test-Path $zip)) { Write-Host "::warning::pluginval could not be downloaded - not validated"; exit 0 }
          # Audit R130: the tool runs on the build machine. Its hash is printed
          # until it is pinned here (docs/CI-RELEASE.md); a pinned mismatch skips it.
          $pinned = ""
          $h = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          Write-Host "pluginval_Windows.zip v1.0.3 sha256 $h"
          if ($pinned -and $h -ne $pinned) { Write-Host "::warning::pluginval_Windows.zip is $h, not the pinned $pinned - not run"; exit 0 }
          Expand-Archive $zip -DestinationPath pluginval_bin -Force
          $bundles = @(Get-ChildItem -Path "${{ matrix.folder }}/build-ci" -Recurse -Filter "*.vst3" -Directory)
          if ($bundles.Count -eq 0) { Write-Host "::warning::No .vst3 found for pluginval"; exit 0 }
          foreach ($v in $bundles) {
            Write-Host "Running pluginval on $($v.FullName)"
            $log = Join-Path $env:RUNNER_TEMP ("pluginval-" + $v.BaseName + ".log")
            $p = Start-Process -FilePath ".\pluginval_bin\pluginval.exe" -NoNewWindow -PassThru `
                   -ArgumentList @('--strictness-level', '5', '--validate-in-process', '--skip-gui-tests', '--timeout-ms', '60000', "`"$($v.FullName)`"") `
                   -RedirectStandardOutput $log -RedirectStandardError "$log.err"
            $null = $p.Handle   # keeps ExitCode readable once the process has gone
            if (-not $p.WaitForExit(1200000)) {
              Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
              Write-Host "::warning::pluginval did not finish within 20 minutes on $($v.Name)"
              continue
            }
            Get-Content -Path $log, "$log.err" -ErrorAction SilentlyContinue
            if ($p.ExitCode -ne 0) { Write-Host "::warning::pluginval failed for ${{ matrix.plugin_id }} ($($v.Name)), exit code $($p.ExitCode)" }
            else { Write-Host "pluginval passed: $($v.Name)" }
          }

      # --- Package with Inno Setup ---
      - name: Install Inno Setup
        run: |
          choco install innosetup --yes --no-progress
          $rc = $LASTEXITCODE
          # Audit R130: not pinned yet. The version this runner got, for the pin
          # (docs/CI-RELEASE.md); the path below is what Compile installer runs.
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (Test-Path $iscc) { Write-Host "Inno Setup in use: $((Get-Item $iscc).VersionInfo.ProductVersion)" }
          else { Write-Host "::warning::no Inno Setup 6 at $iscc" }
          exit $rc

      - name: Download WebView2 Runtime bootstrapper
        if: matrix.needs_webview2 == 'true'
        shell: pwsh
        run: |
          # Every installer ships this file and runs it on the customer's machine
          # (audit R130): it must carry a valid Microsoft signature. Three tries,
          # so a broken download is fetched again instead of shipped or fatal.
          $out = "installer\MicrosoftEdgeWebview2Setup.exe"
          $ok = $false
          for ($i = 1; $i -le 3 -and -not $ok; $i++) {
            Write-Host "Downloading Microsoft Edge WebView2 evergreen bootstrapper (try $i)..."
            try {
              Invoke-WebRequest -Uri "https://go.microsoft.com/fwlink/p/?LinkId=2124703" -OutFile $out -ErrorAction Stop
              $sig = Get-AuthenticodeSignature $out
              if ($sig.Status -eq 'Valid' -and $sig.SignerCertificate.Subject -match 'O=Microsoft Corporation') {
                Write-Host "Signed: $($sig.SignerCertificate.Subject)"
                $ok = $true
              } else {
                Write-Host "::warning::bootstrapper signature $($sig.Status) [$($sig.SignerCertificate.Subject)] (try $i)"
              }
            } catch {
              Write-Host "::warning::bootstrapper download failed (try $i): $_"
            }
            if (-not $ok -and $i -lt 3) { Start-Sleep -Seconds (10 * $i) }
          }
          if (-not $ok) { Write-Host "::error::no validly Microsoft-signed WebView2 bootstrapper after 3 tries - not packaged"; exit 1 }

      - name: Compile installer
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force -Path build-output
          # The exact string the manifest will carry: <CMake base>.<run>.
          # The installers used to stamp a three-part "1.0.<run>" into the
          # registry while the manifest said "<base>.<run>" - and compared
          # component-wise the registry looked newer, so the Center offered
          # no updates ever again.
          $m = Select-String -Path "${{ matrix.folder }}\CMakeLists.txt" -Pattern 'VERSION\s+(\d+\.\d+\.\d+)' | Select-Object -First 1
          $base = if ($m) { $m.Matches[0].Groups[1].Value } else { "1.0.0" }
          $ver = "$base.${{ github.run_number }}"
          # The exact version stamped into this installer, for the release guard
          # (separate buildinfo-* artefact: Release publishes every installer-* file).
          New-Item -ItemType Directory -Force -Path buildinfo | Out-Null
          Set-Content -Path "buildinfo\version.txt" -Value $ver -NoNewline -Encoding ascii
          # With a signing backend, Inno Setup signs the uninstaller and Setup.exe
          # itself through scripts/ci/sign-windows.ps1 (SignTool=rone in the .iss).
          $signArgs = @()
          if ($env:RONE_SIGN_BACKEND -and $env:RONE_SIGN_BACKEND -ne 'none') {
            $signer = (Resolve-Path 'scripts\ci\sign-windows.ps1').Path
            $signArgs = @('/DSIGN', ('/Srone=pwsh -NoProfile -ExecutionPolicy Bypass -File $q' + $signer + '$q -Require $q$f$q'))
          }
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" `
            "/DMyAppVersion=$ver" `
            "/F${{ matrix.installer_name }}_Installer" `
            @signArgs `
            "installer\${{ matrix.iss_file }}"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($env:RONE_SIGN_BACKEND -and $env:RONE_SIGN_BACKEND -ne 'none') {
            $sig = Get-AuthenticodeSignature "build-output\${{ matrix.installer_name }}_Installer.exe"
            if (-not $sig.SignerCertificate) { Write-Host "::error::The installer came out unsigned"; exit 1 }
            Write-Host "Installer signed: $($sig.Status) [$($sig.SignerCertificate.Subject)]"
          }

      # --- Upload ---
      - name: Upload installer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: installer-${{ matrix.plugin_id }}-windows
          path: build-output/${{ matrix.installer_name }}_Installer.exe
          retention-days: 5

      - name: Upload build version
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: buildinfo-${{ matrix.plugin_id }}-windows
          path: buildinfo/version.txt
          retention-days: 5

  # ================================================================
  # 3. BUILD + PACKAGE MACOS
  # ================================================================
  build-macos:
    name: "Mac: ${{ matrix.plugin_id }}"
    needs: detect-changes
    if: needs.detect-changes.outputs.has_macos == 'true'
    runs-on: macos-latest
    env:
      # Code signing + notarization (docs/CODE-SIGNING.md). All optional:
      # without them the build is produced unsigned. See scripts/ci/sign-macos.sh.
      MAC_CERT_P12_BASE64:     ${{ secrets.MAC_CERT_P12_BASE64 }}
      MAC_INST_P12_BASE64:     ${{ secrets.MAC_INST_P12_BASE64 }}
      MAC_CERT_PASSWORD:       ${{ secrets.MAC_CERT_PASSWORD }}
      APPLE_API_KEY_ID:        ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER_ID:     ${{ secrets.APPLE_API_ISSUER_ID }}
      APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.detect-changes.outputs.matrix_macos) }}

    steps:
      # Before the build cache is restored (audit R129, see the Windows leg).
      - name: Mark job start
        run: touch "$RUNNER_TEMP/job-start"

      # --- Checkout ---
      # Audit R027: GH_PAT reaches only the submodule fetch below. The checkout
      # runs with the job token and leaves no credential in .git/config, and the
      # PAT's insteadOf rule is removed again before any third-party step
      # (toolchain set-up, caches, downloads, pluginval, the build) runs.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: false
          persist-credentials: false

      - name: Init submodule — ${{ matrix.folder }}
        shell: bash
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          FOLDER: ${{ matrix.folder }}
        run: |
          # AFTERSPACE lives in-repo (not a submodule) - tolerate that case
          if ! git ls-files --stage -- "$FOLDER" | awk '$1 == "160000" { s = 1 } END { exit !s }'; then
            echo "::notice::$FOLDER is not a submodule (in-repo sources)"
            exit 0
          fi
          rule="url.https://${GH_PAT}@github.com/.insteadOf"
          trap 'git config --global --unset-all "$rule" || true' EXIT
          git config --global "$rule" "https://github.com/"
          for i in 1 2 3; do
            if git submodule update --init --depth 1 -- "$FOLDER"; then exit 0; fi
            echo "::warning::submodule $FOLDER could not be fetched (try $i)"
            sleep $((10 * i))
          done
          echo "::error::submodule $FOLDER could not be fetched after 3 tries"
          exit 1

      # --- The Center's page (audit R032/R197) ---
      # CMake embeds the committed Resources/ui/dist as it is, so dist/ must be
      # the build of the committed src/ (test/dist-fresh.test.mjs, once the
      # Center carries it). Run once, on this leg: /bin/sh expands the test glob
      # on any Node, and a failure here holds the Center back on both platforms
      # (Release publishes a product only when every platform built).
      - name: Center page tests (npm ci && npm test)
        if: matrix.plugin_id == 'plugins_center'
        working-directory: RonePluginsCenter/Resources/ui
        run: |
          echo "node $(node --version), npm $(npm --version)"
          ok=0
          for i in 1 2 3; do
            if npm ci --no-audit --no-fund; then ok=1; break; fi
            echo "::warning::npm ci failed (try $i)"
            rm -rf node_modules
            sleep $((15 * i))
          done
          if [ "$ok" != 1 ]; then echo "::error::npm ci failed 3 times - the page tests did not run"; exit 1; fi
          npm test

      # Audit R122: a Mac Center records no installed build, so a rebuild that
      # keeps the base version the manifest already carries never reaches Macs.
      - name: Center version check (warning only)
        if: matrix.plugin_id == 'plugins_center'
        continue-on-error: true
        run: |
          base=$(grep -oE 'VERSION +[0-9]+\.[0-9]+\.[0-9]+' RonePluginsCenter/CMakeLists.txt | head -1 | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' || true)
          live=$(jq -r '.center_installer.version // ""' versions.json 2>/dev/null || true)
          echo "RonePluginsCenter project(VERSION) ${base:-?}, versions.json center_installer.version ${live:-?}"
          if [ -n "$base" ] && [ "$base" = "$(printf '%s' "$live" | cut -d. -f1-3)" ]; then
            echo "::warning::RonePluginsCenter changed but project(VERSION) is still $base, the base of the live $live - a Mac Center does not take a same-base rebuild (audit R122). Bump project(VERSION) in RonePluginsCenter/CMakeLists.txt."
          fi

      # --- Caches ---
      - name: Build cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ matrix.folder }}/build-ci
          key:  build-${{ matrix.plugin_id }}-mac-${{ hashFiles(format('{0}/CMakeLists.txt', matrix.folder)) }}-${{ github.sha }}
          restore-keys: build-${{ matrix.plugin_id }}-mac-${{ hashFiles(format('{0}/CMakeLists.txt', matrix.folder)) }}-

      - name: JUCE extras cache (flanger)
        if: matrix.is_flanger == 'true'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        id: extras-cache
        with:
          path: rone-flanger-/JUCE/extras/Build
          key:  flanger-juce-extras-8.0.12-mac

      - name: Fetch JUCE extras (flanger)
        if: matrix.is_flanger == 'true' && steps.extras-cache.outputs.cache-hit != 'true'
        working-directory: rone-flanger-
        run: |
          git clone --depth 1 --branch 8.0.12 --filter=blob:none --sparse https://github.com/juce-framework/JUCE.git _tmp
          cd _tmp && git sparse-checkout set extras/Build && cd ..
          cp -R _tmp/extras/Build JUCE/extras/Build
          rm -rf _tmp

      # --- Build ---
      - name: CMake configure
        working-directory: ${{ matrix.folder }}
        run: |
          # Crash reports go through roneaudio.com/api/v1/crash since Center 2.0;
          # no token is compiled into any binary.
          EXTRA=()
          # Deployment target: without it CMake takes the RUNNER's macOS version as the
          # minimum, so every Mac build demanded whatever macos-latest was that day - the
          # shipped Center carried minos 26.0 ("requires macOS 26"), and a customer on an
          # Intel Mac could not install at all. 10.15 reaches every Intel Mac from 2012;
          # the arm64 slice is 11.0 by definition and the linker applies that on its own.
          cmake -B build-ci -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="x86_64;arm64" -DCMAKE_OSX_DEPLOYMENT_TARGET=10.15 "${EXTRA[@]}" || {
            echo "Configure failed (stale build cache?). Wiping build-ci and retrying clean..."
            rm -rf build-ci
            cmake -B build-ci -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="x86_64;arm64" -DCMAKE_OSX_DEPLOYMENT_TARGET=10.15 "${EXTRA[@]}"
          }

      # Bounded: macos-latest has 3 cores and 7 GB. A bare --parallel is an
      # unbounded make -j - on a full Analyzer rebuild (run 222, universal
      # binary) it started ~40 clang processes at once and crawled for 40+
      # minutes while every other leg took 2-6.
      - name: CMake build
        working-directory: ${{ matrix.folder }}
        run: cmake --build build-ci --config Release --parallel 3

      # Log only (audit R129), as on Windows.
      - name: Stale binary check (log only)
        continue-on-error: true
        timeout-minutes: 5
        run: |
          A="${{ matrix.folder }}/build-ci/${{ matrix.cmake_project }}_artefacts/Release"
          if [ ! -d "$A" ]; then echo "no $A - nothing to check"; exit 0; fi
          n=0
          while IFS= read -r f; do
            echo "::warning::stale binary, older than this job (build cache?): $f"
            n=$((n + 1))
          done < <(find "$A" -type f -perm -u+x ! -newer "$RUNNER_TEMP/job-start")
          echo "$n binaries older than this job in $A"

      # --- Code signing (Developer ID) - a no-op until the secrets exist ---
      - name: Import signing identity
        run: bash scripts/ci/sign-macos.sh import

      - name: Sign bundles
        run: bash scripts/ci/sign-macos.sh sign "${{ matrix.folder }}/build-ci/${{ matrix.cmake_project }}_artefacts/Release"

      # --- pluginval (VST3 sanity check) - warns, never fails the build ---
      # Every .vst3 now, not only the first (audit R133); [skip-validate] in the
      # commit subject skips it. Stays warning-only until a log shows it really
      # runs its tests on these runners (docs/CI-RELEASE.md).
      - name: Run pluginval
        if: matrix.plugin_id != 'plugins_center' && matrix.plugin_id != 'stems_fixer' && needs.detect-changes.outputs.skip_validate != 'true'
        continue-on-error: true
        timeout-minutes: 45
        run: |
          got=0
          for i in 1 2 3; do
            if curl -fsSL -o pluginval.zip https://github.com/Tracktion/pluginval/releases/download/v1.0.3/pluginval_macOS.zip; then got=1; break; fi
            echo "::warning::pluginval download failed (try $i)"; sleep $((5 * i))
          done
          if [ "$got" != 1 ]; then echo "::warning::pluginval could not be downloaded - not validated"; exit 0; fi
          # Audit R130: printed until pinned here (docs/CI-RELEASE.md).
          pinned=""
          h=$(shasum -a 256 pluginval.zip | awk '{print $1}')
          echo "pluginval_macOS.zip v1.0.3 sha256 $h"
          if [ -n "$pinned" ] && [ "$h" != "$pinned" ]; then echo "::warning::pluginval_macOS.zip is $h, not the pinned $pinned - not run"; exit 0; fi
          unzip -q -o pluginval.zip -d pluginval_bin
          chmod +x "pluginval_bin/pluginval.app/Contents/MacOS/pluginval"
          n=0
          while IFS= read -r VST3; do
            n=$((n + 1))
            echo "Running pluginval on $VST3"
            "pluginval_bin/pluginval.app/Contents/MacOS/pluginval" --strictness-level 5 --validate-in-process --skip-gui-tests --timeout-ms 60000 "$VST3" </dev/null \
              || echo "::warning::pluginval reported issues for ${{ matrix.plugin_id }} ($(basename "$VST3"))"
          done < <(find "${{ matrix.folder }}/build-ci" -name "*.vst3" -type d -prune)
          if [ "$n" -eq 0 ]; then echo "::warning::No .vst3 found for pluginval"; fi

      # --- auval (Audio Unit validation) - warns only for now (audit R133) ---
      # The AUs were packaged without ever being validated. Each .component is
      # registered in this runner's user folder and checked with auval.
      - name: Run auval
        if: matrix.plugin_id != 'plugins_center' && matrix.plugin_id != 'stems_fixer' && needs.detect-changes.outputs.skip_validate != 'true'
        continue-on-error: true
        timeout-minutes: 20
        run: |
          A="${{ matrix.folder }}/build-ci/${{ matrix.cmake_project }}_artefacts/Release"
          COMP="$HOME/Library/Audio/Plug-Ins/Components"
          mkdir -p "$COMP"
          n=0
          while IFS= read -r c; do
            n=$((n + 1)); name=$(basename "$c"); plist="$c/Contents/Info.plist"
            type=$(/usr/libexec/PlistBuddy -c 'Print :AudioComponents:0:type' "$plist" 2>/dev/null || true)
            sub=$(/usr/libexec/PlistBuddy -c 'Print :AudioComponents:0:subtype' "$plist" 2>/dev/null || true)
            manu=$(/usr/libexec/PlistBuddy -c 'Print :AudioComponents:0:manufacturer' "$plist" 2>/dev/null || true)
            if [ -z "$type" ] || [ -z "$sub" ] || [ -z "$manu" ]; then
              echo "::warning::$name: no AudioComponents entry in its Info.plist - not validated"; continue
            fi
            rm -rf "$COMP/$name"; cp -R "$c" "$COMP/"
            killall -9 AudioComponentRegistrar >/dev/null 2>&1 || true
            echo "auval -v $type $sub $manu   ($name)"
            rc=0; auval -v "$type" "$sub" "$manu" > "$RUNNER_TEMP/auval.log" 2>&1 </dev/null || rc=$?
            if [ "$rc" -eq 0 ] && grep -q "AU VALIDATION SUCCEEDED" "$RUNNER_TEMP/auval.log"; then
              tail -n 5 "$RUNNER_TEMP/auval.log"
            else
              cat "$RUNNER_TEMP/auval.log"
              echo "::warning::auval failed for $name ($type $sub $manu), exit code $rc"
            fi
          done < <(find "$A" -name "*.component" -type d -prune 2>/dev/null)
          if [ "$n" -eq 0 ]; then echo "no .component for ${{ matrix.plugin_id }} - nothing to validate"; fi

      # --- Package ---
      - name: Create macOS installer
        run: |
          mkdir -p build-output
          A="${{ matrix.folder }}/build-ci/${{ matrix.cmake_project }}_artefacts/Release"
          BASE=$(grep -oE 'VERSION +[0-9]+\.[0-9]+\.[0-9]+' "${{ matrix.folder }}/CMakeLists.txt" | head -1 | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' || echo "1.0.0")
          VER="${BASE}.${{ github.run_number }}"
          # The exact version stamped into this installer, for the release guard
          mkdir -p buildinfo && printf '%s' "$VER" > buildinfo/version.txt

          if [ "${{ matrix.plugin_id }}" = "plugins_center" ]; then
            # .dmg for the Center app — search broadly in build-ci/
            echo "=== Searching for .app in build-ci ==="
            find "${{ matrix.folder }}/build-ci" -name "*.app" -type d 2>/dev/null
            APP=$(find "${{ matrix.folder }}/build-ci" -name "*.app" -type d | head -1)
            if [ -n "$APP" ]; then
              echo "Found app: $APP"
              # 2.0.6: the classic window (app, arrow, Applications link) - see the script
              bash scripts/ci/make-center-dmg.sh "$APP" build-output/RONE_Plugins_Center.dmg
              bash scripts/ci/sign-macos.sh dmg build-output/RONE_Plugins_Center.dmg
            else
              echo "::error::No .app found for plugins_center"
              find "${{ matrix.folder }}/build-ci" -maxdepth 5 -type d | head -40
              exit 1
            fi
          else
            # .pkg for plugins
            mkdir -p staging

            # --- Discover and stage all build artifacts recursively ---
            echo "=== Scanning build artifacts in $A ==="
            find "$A" -maxdepth 3 \( -name "*.vst3" -o -name "*.component" -o -name "*.app" \) -type d | sort
            echo "=== End scan ==="

            # VST3 bundles (recursive search)
            find "$A" -name "*.vst3" -type d 2>/dev/null | while IFS= read -r f; do
              mkdir -p staging/Library/Audio/Plug-Ins/VST3
              cp -R "$f" staging/Library/Audio/Plug-Ins/VST3/
              echo "Staged VST3: $(basename "$f")"
            done

            # AU bundles (recursive search)
            find "$A" -name "*.component" -type d 2>/dev/null | while IFS= read -r f; do
              mkdir -p staging/Library/Audio/Plug-Ins/Components
              cp -R "$f" staging/Library/Audio/Plug-Ins/Components/
              echo "Staged AU: $(basename "$f")"
            done

            # Standalone .app — search Standalone/ first, then Release/ root
            # Works for both juce_add_plugin (Standalone/) and juce_add_gui_app (root)
            find "$A" -name "*.app" -type d -maxdepth 2 2>/dev/null | while IFS= read -r f; do
              mkdir -p staging/Applications
              cp -R "$f" staging/Applications/
              echo "Staged App: $(basename "$f") -> /Applications/"
            done

            # --- User manual (docs/manuals, shipped with every plugin) ---
            MANUAL="docs/manuals/${{ matrix.manual_pdf }}"
            if [ -n "${{ matrix.manual_pdf }}" ] && [ -f "$MANUAL" ]; then
              mkdir -p "staging/Users/Shared/RONE Plugins/Manuals"
              cp "$MANUAL" "staging/Users/Shared/RONE Plugins/Manuals/"
              echo "Staged manual: $(basename "$MANUAL")"
            else
              echo "::warning::No manual found for ${{ matrix.plugin_id }} (expected $MANUAL)"
            fi

            # --- Fail-safe: refuse to create empty pkg ---
            FILE_COUNT=$(find staging -type f 2>/dev/null | wc -l | tr -d ' ')
            if [ "$FILE_COUNT" -eq 0 ]; then
              echo "::error::FATAL: No artifacts found for ${{ matrix.plugin_id }}. Staging is empty!"
              find "$A" -maxdepth 3 -type d | head -30
              exit 1
            fi
            echo "Total files staged: $FILE_COUNT"

            if ! find staging/Applications -name "*.app" -type d -maxdepth 1 2>/dev/null | grep -q .; then
              echo "::warning::No standalone .app found for ${{ matrix.plugin_id }}"
            fi

            # --- Component plist: disable BundleIsRelocatable ---
            pkgbuild --analyze --root staging /tmp/comp.plist
            python3 -c "import plistlib; f=open('/tmp/comp.plist','rb'); p=plistlib.load(f); f.close(); [item.__setitem__('BundleIsRelocatable',False) for item in p]; f=open('/tmp/comp.plist','wb'); plistlib.dump(p,f); f.close()"
            echo "Component plist contents:"
            cat /tmp/comp.plist

            # The plugins were renamed "RONE <Name>" (build #155). A preinstall
            # script removes the old bundles so a DAW rescan never lists the
            # plugin twice; the plugin code is unchanged, so projects still load.
            mkdir -p pkgscripts
            {
              echo '#!/bin/sh'
              echo 'old="${{ matrix.legacy_name }}"'
              echo 'if [ -n "$old" ]; then'
              echo '  rm -rf "/Library/Audio/Plug-Ins/VST3/$old.vst3" "/Library/Audio/Plug-Ins/Components/$old.component" "/Applications/$old.app" "/Applications/RONE Plugins/$old.app"'
              echo 'fi'
              # A moduleinfo.json from an older build describes that build (RONE Reverse Reverb's
              # said "Instrument|Synth" after 1.1.7 became an effect); these builds ship none, and a
              # pkg never removes files it does not install - drop it before the payload lands.
              for b in staging/Library/Audio/Plug-Ins/VST3/*.vst3; do
                if [ -d "$b" ]; then echo "rm -f \"/Library/Audio/Plug-Ins/VST3/$(basename "$b")/Contents/Resources/moduleinfo.json\""; fi
              done
              echo 'exit 0'
            } > pkgscripts/preinstall
            chmod +x pkgscripts/preinstall

            pkgbuild --root staging \
              --component-plist /tmp/comp.plist \
              --scripts pkgscripts \
              --identifier "com.roneplugins.${{ matrix.plugin_id }}" \
              --version "$VER" \
              --install-location / \
              build-output/${{ matrix.installer_name }}_Installer.pkg

            echo "Created: ${{ matrix.installer_name }}_Installer.pkg ($(du -h build-output/${{ matrix.installer_name }}_Installer.pkg | cut -f1))"
            bash scripts/ci/sign-macos.sh pkg "build-output/${{ matrix.installer_name }}_Installer.pkg"
            rm -rf staging
          fi

      # --- What no Mac tester sees before a customer does (audit R077) ---
      # Warnings only: both architectures in every binary, the minimum macOS
      # each slice asks for (10.15 Intel, 11.0 Apple silicon), the .pkg's
      # payload as macOS will install it, and that its preinstall parses.
      - name: Check the Mac build (warnings only)
        continue-on-error: true
        timeout-minutes: 10
        run: |
          A="${{ matrix.folder }}/build-ci/${{ matrix.cmake_project }}_artefacts/Release"
          ver_gt() { awk -v a="$1" -v b="$2" 'BEGIN { n = split(a, x, "."); m = split(b, y, "."); k = n > m ? n : m
            for (i = 1; i <= k; i++) { if (x[i] + 0 > y[i] + 0) exit 0; if (x[i] + 0 < y[i] + 0) exit 1 } exit 1 }'; }
          if [ -d "$A" ]; then
            while IFS= read -r b; do
              while IFS= read -r f; do
                file -b "$f" | grep -q 'Mach-O' || continue
                rel=${f#"$A"/}
                archs=$(lipo -archs "$f" 2>/dev/null || true)
                echo "$rel: [$archs]"
                for want in x86_64 arm64; do
                  case " $archs " in *" $want "*) ;; *) echo "::warning::$rel has no $want slice"; continue ;; esac
                  minos=$(vtool -arch "$want" -show-build "$f" 2>/dev/null | awk '$1 == "minos" { print $2; exit }')
                  if [ -z "$minos" ]; then
                    minos=$(otool -arch "$want" -l "$f" 2>/dev/null | awk '/LC_VERSION_MIN_MACOSX/ { m = 1 } m && $1 == "version" { print $2; exit }')
                  fi
                  limit=10.15; if [ "$want" = arm64 ]; then limit=11.0; fi
                  echo "  $want minos ${minos:-?}"
                  if [ -z "$minos" ]; then echo "::warning::$rel ($want): no minimum macOS found"
                  elif ver_gt "$minos" "$limit"; then echo "::warning::$rel ($want) asks for macOS $minos, above $limit - older Macs cannot load it"; fi
                done
              done < <(find "$b" -type f -perm -u+x)
            done < <(find "$A" \( -name "*.vst3" -o -name "*.component" -o -name "*.app" \) -type d -prune)
          else
            echo "::warning::no $A - binaries not checked"
          fi
          for p in build-output/*.pkg; do
            [ -f "$p" ] || continue
            x="$RUNNER_TEMP/pkgcheck"; rm -rf "$x"
            if ! pkgutil --expand-full "$p" "$x"; then echo "::warning::pkgutil could not expand $p"; continue; fi
            echo "== $(basename "$p") installs:"
            if [ -d "$x/Payload" ]; then
              (cd "$x/Payload" && find . \( -name "*.vst3" -o -name "*.component" -o -name "*.app" -o -name "*.pdf" \) -prune -print)
            else
              echo "::warning::$(basename "$p") has no payload"
            fi
            if [ -f "$x/Scripts/preinstall" ]; then
              if sh -n "$x/Scripts/preinstall"; then echo "preinstall parses"; else echo "::warning::the preinstall script of $(basename "$p") does not parse"; fi
            else
              echo "::warning::$(basename "$p") has no preinstall script"
            fi
          done

      # --- Upload ---
      - name: Upload installer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: installer-${{ matrix.plugin_id }}-macos
          path: |
            build-output/*.pkg
            build-output/*.dmg
          retention-days: 5

      - name: Upload build version
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: buildinfo-${{ matrix.plugin_id }}-macos
          path: buildinfo/version.txt
          retention-days: 5

      - name: Remove signing keychain
        if: always()
        run: bash scripts/ci/sign-macos.sh cleanup

  # ================================================================
  # 4. RELEASE — per-plugin rolling releases with stable download URLs
  # ================================================================
  release:
    name: Release
    needs: [detect-changes, build-windows, build-macos]
    # Deliberately not gated on the build results.
    #
    # It used to require both matrices to have come out 'success', and a matrix
    # job's result is a failure if any single leg failed. So one plugin failing
    # to upload an artefact - which is a thing that happens, and did on #184 -
    # skipped the release for every plugin in the run. Nothing was published,
    # and a skipped job is grey rather than red, so the run did not look
    # broken; the only symptom was that the Center never offered the update.
    #
    # Publishing per plugin is already safe: the step below skips any plugin
    # with no artefacts, and uploads with --clobber so the platform that did
    # build never wipes the one that did not. The 'verdict' job at the end
    # turns the run red so a partial release is still loud.
    if: >-
      !cancelled() &&
      github.event_name == 'push' &&
      needs.detect-changes.outputs.changed != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    outputs:
      published:     ${{ steps.publish.outputs.published }}
      guard_skipped: ${{ steps.publish.outputs.guard_skipped }}
      upload_failed: ${{ steps.publish.outputs.upload_failed }}
      alias_failed:  ${{ steps.publish.outputs.alias_failed }}
      suffix:        ${{ steps.publish.outputs.suffix }}

    steps:
      # This run's commit: the release guard reads tree entries from it and
      # compares them with a fresh origin/main.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1
          submodules: false

      - name: Note a partial build
        if: needs.build-windows.result != 'success' || needs.build-macos.result != 'success'
        run: |
          {
            echo "### Partial release"
            echo ""
            echo "| leg | result |"
            echo "|---|---|"
            echo "| windows | ${{ needs.build-windows.result }} |"
            echo "| macos   | ${{ needs.build-macos.result }} |"
            echo ""
            echo "Only the plugins whose installers were actually produced have been"
            echo "published. Anything missing kept its previous release asset and its"
            echo "previous entry in versions.json."
          } >> $GITHUB_STEP_SUMMARY

      - name: Download all installer artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts/
          pattern: installer-*

      - name: Download build versions
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: buildinfo/
          pattern: buildinfo-*

      - name: Create per-plugin releases
        id: publish
        run: |
          REPO="${{ github.repository }}"
          RUN="${{ github.run_number }}"
          changed='${{ needs.detect-changes.outputs.changed }}'
          matrix_win='${{ needs.detect-changes.outputs.matrix_windows }}'
          matrix_mac='${{ needs.detect-changes.outputs.matrix_macos }}'
          published='[]'; guard_skipped=''; upload_failed=''; alias_failed=''

          # Every installer also goes up under a name of its own (audit R028):
          # <stem>-<run>.<attempt>.<ext>, e.g. RoneStutter_Installer-272.1.exe.
          # Nothing ever replaces the bytes behind such a name, so a manifest
          # that points at it can never pair a new file with an old sha256. A
          # re-run of this job is a new attempt, so it never meets its own names.
          SUFFIX="${{ github.run_number }}.${{ github.run_attempt }}"
          echo "suffix=$SUFFIX" >> $GITHUB_OUTPUT
          VDIR="${RUNNER_TEMP:-/tmp}/versioned"
          versioned_name() { local n=$1; printf '%s-%s.%s' "${n%.*}" "$SUFFIX" "${n##*.}"; }

          # Version-regression guard (scripts/ci/release-guard.sh). Cannot read
          # origin/main -> fail here, before anything is uploaded.
          GUARD_FETCH_ARGS="--depth 1"
          source scripts/ci/release-guard.sh
          guard_fetch_main || exit 1

          # One file at a time, three tries each. --clobber deletes the old asset
          # before the upload; when GitHub answers 500 to that delete (a stuck
          # asset, #254 on 2026-10-06) the old one is renamed aside - GitHub
          # accepts that - and the upload goes again. Never several files in one
          # call: #254's second try deleted the .exe, failed on the .dmg and
          # uploaded neither, so the Center could not be downloaded at all.
          # On a versioned name the only thing --clobber can meet is this same
          # attempt's own half-finished try, which nothing points at yet.
          #
          # The Center's alias (audit R090 part 2): the site's /download/center/*
          # and older Centers fetch it by name, so that name must never 404 - and
          # --clobber deletes the old file before the new one lands. On the
          # Center tag an alias that is already there is swapped instead: the new
          # file goes up as tmp-<run>-<name>, the old asset is renamed
          # stale-<id>-<name> (the next run's stale- cleanup deletes it), then the
          # tmp asset takes the name. Every other upload is unchanged.
          asset_id() {
            gh api "repos/$REPO/releases/tags/$1" --jq ".assets[] | select(.name == \"$2\") | .id" 2>/dev/null | head -1 || true
          }
          swap_one() {
            local tag=$1 f=$2 name tmp tdir oid tid
            name=$(basename "$f"); tmp="tmp-$RUN-$name"
            tdir="${RUNNER_TEMP:-/tmp}/swap"
            mkdir -p "$tdir" && cp "$f" "$tdir/$tmp" || return 1
            if ! gh release upload "$tag" "$tdir/$tmp" --clobber -R "$REPO"; then
              # a half-finished tmp goes aside, so the next try never meets it
              tid=$(asset_id "$tag" "$tmp")
              if [ -n "$tid" ]; then gh api -X PATCH "repos/$REPO/releases/assets/$tid" -f name="stale-$tid-$tmp" >/dev/null 2>&1 || true; fi
              return 1
            fi
            tid=$(asset_id "$tag" "$tmp")
            if [ -z "$tid" ]; then return 1; fi
            oid=$(asset_id "$tag" "$name")
            if [ -n "$oid" ] && ! gh api -X PATCH "repos/$REPO/releases/assets/$oid" -f name="stale-$oid-$name" >/dev/null; then
              gh api -X PATCH "repos/$REPO/releases/assets/$tid" -f name="stale-$tid-$tmp" >/dev/null 2>&1 || true
              return 1
            fi
            if ! gh api -X PATCH "repos/$REPO/releases/assets/$tid" -f name="$name" >/dev/null; then
              # the previous file takes its name back
              if [ -n "$oid" ]; then gh api -X PATCH "repos/$REPO/releases/assets/$oid" -f name="$name" >/dev/null 2>&1 || true; fi
              gh api -X PATCH "repos/$REPO/releases/assets/$tid" -f name="stale-$tid-$tmp" >/dev/null 2>&1 || true
              return 1
            fi
            echo "swapped $name on $tag (the previous file is stale-$oid-$name until the next run)"
          }
          upload_one() {
            local tag=$1 f=$2 name i sid
            name=$(basename "$f")
            if [ "$tag" = "PluginsCenter-latest" ] && [ -n "$(asset_id "$tag" "$name")" ]; then
              for i in 1 2 3; do
                if swap_one "$tag" "$f"; then return 0; fi
                echo "::warning::swap of $name on $tag failed (try $i)"
                sleep $((i * 15))
              done
              echo "::error::$name could not be replaced on $tag - the previous file keeps the name"
              return 1
            fi
            for i in 1 2 3; do
              if gh release upload "$tag" "$f" --clobber -R "$REPO"; then return 0; fi
              echo "::warning::upload of $name to $tag failed (try $i)"
              sid=$(gh api "repos/$REPO/releases/tags/$tag" --jq ".assets[] | select(.name == \"$name\") | .id" 2>/dev/null || true)
              if [ -n "$sid" ]; then
                gh api -X PATCH "repos/$REPO/releases/assets/$sid" -f name="stale-$sid-$name" >/dev/null \
                  && echo "moved a stuck $name aside (asset $sid)"
              fi
              sleep $((i * 15))
            done
            echo "::error::$name could not be uploaded to $tag"
            return 1
          }

          for id in $(echo "$changed" | jq -r '.[]'); do
            case "$id" in
              reverse_reverb) tag=ReverseReverb-latest;    title="RONE Reverse Reverb (Latest)";  folder=ReverseReverbVST;   jid=ReverseReverb ;;
              stems_fixer)    tag=RoneStemsFixer-latest;    title="RONE Stems Fixer (Latest)";    folder=RoneStemsFixer;     jid=RoneStemsFixer ;;
              stutter)        tag=RoneStutter-latest;       title="RONE Stutter (Latest)";        folder=RoneStutter;        jid=RoneStutter ;;
              stucker)        tag=RoneStucker-latest;       title="RONE Stucker (Latest)";        folder=RoneStucker;        jid=RoneStucker ;;
              throw)          tag=RoneThrow-latest;         title="RONE Throw (Latest)";          folder=RoneThrow;          jid=RoneThrow ;;
              clipper)        tag=RoneClipper-latest;       title="RONE Clipper (Latest)";        folder=RoneClipper;        jid=RoneClipper ;;
              rise)           tag=RoneRise-latest;          title="RONE Rise (Latest)";           folder=RoneRise;           jid=RoneRise ;;
              iron)           tag=RoneIron-latest;          title="RONE Iron (Latest)";           folder=RoneIron;           jid=RoneIron ;;
              control)        tag=RoneControl-latest;       title="RONE Control (Latest)";        folder=RoneControl;        jid=RoneControl ;;
              rone1176)       tag=Rone1176-latest;          title="RONE 1176 (Latest)";           folder=Rone1176;           jid=Rone1176 ;;
              rone2a)         tag=Rone2A-latest;            title="RONE 2A (Latest)";             folder=Rone2A;             jid=Rone2A ;;
              flanger)        tag=RoneFlanger-latest;       title="RONE Flanger (Latest)";        folder=rone-flanger-;      jid=RoneFlanger ;;
              sync_verb)      tag=RoneSyncVerb-latest;      title="RONE Sync Verb (Latest)";      folder="rone sync verb";   jid=RoneSyncVerb ;;
              afterspace)     tag=RoneAfterspace-latest;    title="RONE AFTERSPACE (Latest)";     folder="RONE AFTER SPACE"; jid=RoneAfterspace ;;
              plugins_center) tag=PluginsCenter-latest;     title="RONE Plugins Center (Latest)"; folder=RonePluginsCenter;  jid=__center__ ;;
              analyzer)       tag=RONEAnalyzer-latest;      title="RONE Analyzer (Latest)";       folder=RONEAnalyzer;       jid=RONEAnalyzer ;;
              *) echo "::error::$id: unknown product - skipped"; continue ;;
            esac

            # Collect all installer files for this plugin
            files=()
            for dir in artifacts/installer-${id}-*/; do
              [ -d "$dir" ] || continue
              for f in "$dir"*; do
                [ -f "$f" ] && files+=("$f")
              done
            done

            if [ ${#files[@]} -eq 0 ]; then
              echo "⚠ No artifacts for $id — skipping"
              continue
            fi

            # Every platform it was built for, or nothing (2026-10-06, #253: the
            # Mac Center failed, Windows went out alone, and the manifest then
            # called the old Mac .dmg the new version). Update versions.json
            # applies the same rule, so the release and the manifest stay as
            # they were and the red run says why.
            missing=""
            if [ "$(echo "$matrix_win" | jq -r --arg id "$id" 'any(.[]; .plugin_id == $id)')" = true ] \
               && ! ls artifacts/installer-${id}-windows/* >/dev/null 2>&1; then missing="$missing windows"; fi
            if [ "$(echo "$matrix_mac" | jq -r --arg id "$id" 'any(.[]; .plugin_id == $id)')" = true ] \
               && ! ls artifacts/installer-${id}-macos/* >/dev/null 2>&1; then missing="$missing macos"; fi
            if [ -n "$missing" ]; then
              echo "::error::$id did not build on:$missing - nothing of it is published this run"
              continue
            fi

            # Version-regression guard, before any upload: the version the legs
            # stamped (buildinfo-*), both platforms agreeing, newer than live,
            # built from the folder that is on main now.
            # One line per file: version.txt has no trailing newline, so a plain cat glued
            # the Win and Mac stamps into one string ("1.3.10.2671.3.10.267", run #267).
            vers=$(for f in buildinfo/buildinfo-${id}-*/version.txt; do [ -f "$f" ] && { tr -d '\r\n' < "$f"; echo; }; done | sort -u)
            if [ -z "$vers" ] || [ "$(printf '%s\n' "$vers" | wc -l)" -ne 1 ] || ! printf '%s' "$vers" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$'; then
              echo "::error::$id: build version missing or different per platform ('$(echo $vers)') - not published"
              guard_skipped="$guard_skipped $id"; continue
            fi
            if ! guard_check "$id" "$folder" "$jid" "$vers"; then
              guard_skipped="$guard_skipped $id"; continue
            fi
            # A newer run already put its build on this release (its versions.json
            # commit may still be on the way): never overwrite it with an older one.
            cur=$(gh release view "$tag" -R "$REPO" --json body -q .body 2>/dev/null | grep -oE 'Build #[0-9]+' | head -1 | tr -dc '0-9' || true)
            if [ -n "$cur" ] && [ "$cur" -gt "$RUN" ]; then
              echo "::error::$id: $tag already carries build #$cur, newer than this run #$RUN - not published"
              guard_skipped="$guard_skipped $id"; continue
            fi

            NOTES="Build #${{ github.run_number }} · $(date -u +%Y-%m-%d)"
            if gh release view "$tag" -R "$REPO" >/dev/null 2>&1; then
              # Leftovers nothing points at, best effort: what a stuck upload moved
              # aside (stale-*), and a hand-parked copy like the Center's
              # RONE_Plugins_Center-stuck-<id>.dmg (audit R289).
              for sid in $(gh api "repos/$REPO/releases/tags/$tag" --jq '.assets[] | select((.name | startswith("stale-")) or (.name | test("-stuck-"))) | .id' 2>/dev/null || true); do
                gh api -X DELETE "repos/$REPO/releases/assets/$sid" >/dev/null 2>&1 || true
              done
            elif ! gh release create "$tag" --title "$title" --notes "$NOTES" --latest=false -R "$REPO"; then
              # Created empty and filled one file at a time below, like every upload.
              echo "::error::$id: could not create the release $tag - nothing of it is published"
              upload_failed="$upload_failed $id"; continue
            fi

            # 1. The versioned files, the ones versions.json will name. All of them
            #    or the product is not published - and the loop goes on to the next
            #    product instead of ending the step (audit R030): a failure used to
            #    exit here, so every product uploaded before it kept the old sha256.
            ok=1; vfiles=()
            mkdir -p "$VDIR/$id"
            for f in "${files[@]}"; do
              v="$VDIR/$id/$(versioned_name "$(basename "$f")")"
              cp "$f" "$v" && vfiles+=("$v") || ok=0
            done
            if [ "$ok" = 1 ]; then
              for v in "${vfiles[@]}"; do
                upload_one "$tag" "$v" || { ok=0; break; }
              done
            fi
            if [ "$ok" != 1 ]; then
              echo "::error::$id: not every installer reached $tag - not published, versions.json keeps the previous build"
              upload_failed="$upload_failed $id"; continue
            fi

            # 2. The unversioned alias (RoneStutter_Installer.exe, ...): the site's
            #    download buttons and older Centers' built-in catalogue use it,
            #    versions.json does not. A failure warns and the Verdict turns the
            #    run red, but the product is published - its versioned files are up.
            for f in "${files[@]}"; do
              if ! upload_one "$tag" "$f"; then
                echo "::warning::$id: the alias $(basename "$f") on $tag was not refreshed (versions.json does not use it)"
                alias_failed="$alias_failed $id:$(basename "$f")"
              fi
            done
            gh release edit "$tag" --title "$title" --notes "$NOTES" -R "$REPO" || echo "::warning::release notes of $tag not updated"

            echo "✓ $tag — ${#files[@]} file(s), versioned -$SUFFIX"
            published=$(echo "$published" | jq -c --arg id "$id" '. + [$id]')
          done

          # update-manifest bumps only what was really published here.
          echo "published=$published" >> $GITHUB_OUTPUT
          echo "guard_skipped=${guard_skipped# }" >> $GITHUB_OUTPUT
          echo "upload_failed=${upload_failed# }" >> $GITHUB_OUTPUT
          echo "alias_failed=${alias_failed# }" >> $GITHUB_OUTPUT
          if [ -n "$guard_skipped" ]; then
            echo "### Release guard skipped:$guard_skipped" >> $GITHUB_STEP_SUMMARY
          fi
          if [ -n "$upload_failed" ]; then
            echo "### Upload failed, not published:$upload_failed" >> $GITHUB_STEP_SUMMARY
          fi
          if [ -n "$alias_failed" ]; then
            echo "### Alias not refreshed:$alias_failed" >> $GITHUB_STEP_SUMMARY
          fi

  # ================================================================
  # 5. UPDATE MANIFEST — auto-bump versions.json + commit
  # ================================================================
  update-manifest:
    name: Update versions.json
    needs: [detect-changes, release]
    if: >-
      !cancelled() &&
      github.event_name == 'push' &&
      needs.detect-changes.outputs.changed != '[]' &&
      needs.release.result == 'success'
    runs-on: ubuntu-latest
    # contents: read is enough: the push below authenticates with GH_PAT.
    outputs:
      guard_skipped: ${{ steps.bump.outputs.guard_skipped }}
      push_skipped:  ${{ steps.push.outputs.push_skipped }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          token: ${{ secrets.GH_PAT }}
          submodules: false
          ref: main

      - name: Download installer artifacts (for sha256)
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts/
          pattern: installer-*

      - name: Download build versions
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: buildinfo/
          pattern: buildinfo-*

      - name: Init changed submodules
        run: |
          git config --global url."https://${{ secrets.GH_PAT }}@github.com/".insteadOf "https://github.com/"
          changed='${{ needs.detect-changes.outputs.changed }}'
          for id in $(echo "$changed" | jq -r '.[]'); do
            case "$id" in
              reverse_reverb) f=ReverseReverbVST ;;
              stems_fixer)    f=RoneStemsFixer ;;
              stutter)        f=RoneStutter ;;
              stucker)        f=RoneStucker ;;
              throw)          f=RoneThrow ;;
              clipper)        f=RoneClipper ;;
              rise)           f=RoneRise ;;
              iron)           f=RoneIron ;;
              control)        f=RoneControl ;;
              rone1176)       f=Rone1176 ;;
              rone2a)         f=Rone2A ;;
              flanger)        f=rone-flanger- ;;
              sync_verb)      f="rone sync verb" ;;
              afterspace)     f="RONE AFTER SPACE" ;;
              plugins_center) f=RonePluginsCenter ;;
              analyzer)       f=RONEAnalyzer ;;
            esac
            git submodule update --init --depth 1 -- "$f" 2>/dev/null || true
          done

      - name: Bump versions.json
        id: bump
        env:
          # gh release view: which build owns each <Tag>-latest asset now.
          GH_TOKEN: ${{ github.token }}
        run: |
          # Only what Release really published (a product the release guard
          # skipped kept its old assets, so its entry must stay too).
          published='${{ needs.release.outputs.published || '[]' }}'
          matrix_win='${{ needs.detect-changes.outputs.matrix_windows }}'
          matrix_mac='${{ needs.detect-changes.outputs.matrix_macos }}'
          RUN="${{ github.run_number }}"
          REPO="${{ github.repository }}"
          # The versioned asset names Release uploaded (audit R028/R205).
          SUFFIX='${{ needs.release.outputs.suffix }}'
          guard_skipped=''

          # Release already ran the full guard BEFORE uploading; every id in
          # 'published' is now this run's build on <Tag>-latest, so its entry
          # must follow it - never held back because main moved since (that
          # would pair the new installer with the old sha256). Skipped only
          # when origin/main's versions.json already has this version or newer,
          # or a newer build has since replaced the asset (guard_manifest_check).
          # A failed fetch fails this job loudly; re-run it to write what
          # Release published.
          GUARD_FETCH_ARGS=""
          GUARD_NO_RUN_COMMIT=1
          source scripts/ci/release-guard.sh
          # This step only writes the PLAN; Commit & push applies it on top of
          # whatever main is when it pushes (audit R207, scripts/ci/manifest-plan.sh).
          source scripts/ci/manifest-plan.sh
          PLAN="$RUNNER_TEMP/bump-plan.txt"
          : > "$PLAN"
          if ! [[ "$SUFFIX" =~ ^[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release reported no asset suffix ('$SUFFIX') - versions.json left alone; re-run the workflow"
            exit 1
          fi
          if ! guard_fetch_main; then
            {
              echo "### versions.json NOT updated"
              echo "Release published $published - those installers are live but the"
              echo "manifest still has the old version/sha256. Re-run this job."
            } >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

          for id in $(echo "$published" | jq -r '.[]'); do
            case "$id" in
              reverse_reverb) folder=ReverseReverbVST;  jid=ReverseReverb;  tag=ReverseReverb-latest;  inst=ReverseReverb ;;
              stems_fixer)    folder=RoneStemsFixer;     jid=RoneStemsFixer;  tag=RoneStemsFixer-latest;  inst=RoneStemsFixer ;;
              stutter)        folder=RoneStutter;        jid=RoneStutter;     tag=RoneStutter-latest;     inst=RoneStutter ;;
              stucker)        folder=RoneStucker;        jid=RoneStucker;     tag=RoneStucker-latest;     inst=RoneStucker ;;
              throw)          folder=RoneThrow;          jid=RoneThrow;       tag=RoneThrow-latest;       inst=RoneThrow ;;
              clipper)        folder=RoneClipper;        jid=RoneClipper;     tag=RoneClipper-latest;     inst=RoneClipper ;;
              rise)           folder=RoneRise;           jid=RoneRise;        tag=RoneRise-latest;        inst=RoneRise ;;
              iron)           folder=RoneIron;           jid=RoneIron;        tag=RoneIron-latest;        inst=RoneIron ;;
              control)        folder=RoneControl;        jid=RoneControl;     tag=RoneControl-latest;     inst=RoneControl ;;
              rone1176)       folder=Rone1176;           jid=Rone1176;        tag=Rone1176-latest;        inst=Rone1176 ;;
              rone2a)         folder=Rone2A;             jid=Rone2A;          tag=Rone2A-latest;          inst=Rone2A ;;
              flanger)        folder=rone-flanger-;      jid=RoneFlanger;     tag=RoneFlanger-latest;     inst=RoneFlanger ;;
              sync_verb)      folder="rone sync verb";   jid=RoneSyncVerb;   tag=RoneSyncVerb-latest;    inst=RoneSyncVerb ;;
              afterspace)     folder="RONE AFTER SPACE"; jid=RoneAfterspace; tag=RoneAfterspace-latest;  inst=RoneAfterspace ;;
              plugins_center) folder=RonePluginsCenter;  jid=__center__;     tag=PluginsCenter-latest;   inst=RONE_Plugins_Center ;;
              analyzer)       folder=RONEAnalyzer;       jid=RONEAnalyzer;   tag=RONEAnalyzer-latest;    inst=RONEAnalyzer ;;
            esac

            # The label is the version the installers carry (buildinfo, which
            # Release already checked); main's CMakeLists is only a cross-check.
            base=$(grep -oP 'VERSION\s+\K[0-9]+\.[0-9]+\.[0-9]+' "$folder/CMakeLists.txt" 2>/dev/null | head -1 || true)
            built=$(for f in buildinfo/buildinfo-${id}-*/version.txt; do [ -f "$f" ] && { tr -d '\r\n' < "$f"; echo; }; done | sort -u || true)
            if [ -n "$built" ] && [ "$(printf '%s\n' "$built" | wc -l)" -eq 1 ] && printf '%s' "$built" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$'; then
              ver="$built"
              if [ -n "$base" ] && [ "$ver" != "${base}.${RUN}" ]; then
                echo "::warning::$id: installers carry $ver, main's CMakeLists says ${base}.${RUN} - the manifest follows the installers"
              fi
            elif [ -n "$base" ]; then
              ver="${base}.${RUN}"
              echo "::warning::$id: no single build version in buildinfo ('$(echo $built)') - labelled $ver from CMakeLists"
            else
              echo "::error::$id: no build version and no CMakeLists version - manifest left alone although Release published it; re-run this job"
              guard_skipped="$guard_skipped $id"; continue
            fi

            # Compute SHA256 for whatever we built this run (per-platform).
            # A platform that did not build -> empty string, and its fields stay.
            sha_win=""; sha_mac=""
            if [ "$jid" = "__center__" ]; then
              win_file=$(find artifacts -type f -name "${inst}_Installer.exe" 2>/dev/null | head -1)
              mac_file=$(find artifacts -type f -name "${inst}.dmg"            2>/dev/null | head -1)
            else
              win_file=$(find artifacts -type f -name "${inst}_Installer.exe" 2>/dev/null | head -1)
              mac_file=$(find artifacts -type f -name "${inst}_Installer.pkg" 2>/dev/null | head -1)
            fi
            [ -n "$win_file" ] && sha_win=$(sha256sum "$win_file" | awk '{print $1}')
            [ -n "$mac_file" ] && sha_mac=$(sha256sum "$mac_file" | awk '{print $1}')
            size_win=0; size_mac=0
            [ -n "$win_file" ] && size_win=$(stat -c%s "$win_file")
            [ -n "$mac_file" ] && size_mac=$(stat -c%s "$mac_file")
            echo "  $jid: sha_win=${sha_win:0:12}... sha_mac=${sha_mac:0:12}..."

            # Nothing at all was produced for this plugin this run, which
            # means its build failed. Bumping the version anyway would point
            # the Center at the *previous* installer under a new number, with
            # a hash that does not match it - an update that can only fail.
            if [ -z "$win_file" ] && [ -z "$mac_file" ]; then
              echo "  $jid: no artefacts this run - manifest left alone"
              continue
            fi

            # Built on only one of the platforms it was meant for: the Release
            # job published nothing of it, so the manifest stays too. The ONE
            # version field covers both platforms - bumping it would offer the
            # other platform's OLD installer as the new version (#253, 2026-10-06).
            if { [ "$(echo "$matrix_win" | jq -r --arg id "$id" 'any(.[]; .plugin_id == $id)')" = true ] && [ -z "$win_file" ]; } \
               || { [ "$(echo "$matrix_mac" | jq -r --arg id "$id" 'any(.[]; .plugin_id == $id)')" = true ] && [ -z "$mac_file" ]; }; then
              echo "  $jid: did not build on every platform it was meant for - manifest left alone"
              continue
            fi

            # Leave the entry only when the live manifest already has this
            # version (rc 2, a re-run) or newer, or a newer build now owns
            # <Tag>-latest (rc 1, flagged). No folder-vs-main test here.
            rc=0; guard_manifest_check "$id" "$jid" "$ver" "$tag" "$RUN" "$REPO" || rc=$?
            if [ "$rc" -eq 2 ]; then continue; fi
            if [ "$rc" -ne 0 ]; then
              guard_skipped="$guard_skipped $id"; continue
            fi

            # The versioned files Release uploaded (audit R028/R205): nothing ever
            # replaces the bytes behind these URLs, so a Center can never pair
            # them with another build's hash. Only a platform built this run
            # gets a URL; the other keeps its fields.
            if [ "$jid" = "__center__" ]; then
              wname="${inst}_Installer-${SUFFIX}.exe"; mname="${inst}-${SUFFIX}.dmg"
            else
              wname="${inst}_Installer-${SUFFIX}.exe"; mname="${inst}_Installer-${SUFFIX}.pkg"
            fi
            url=""; url_mac=""
            [ -n "$sha_win" ] && url="https://github.com/$REPO/releases/download/$tag/$wname"
            [ -n "$sha_mac" ] && url_mac="https://github.com/$REPO/releases/download/$tag/$mname"

            # Never write a URL that does not answer, or whose bytes GitHub hashes
            # differently: the entry then stays on the previous build (which still
            # matches its own hash) and the run goes red.
            bad=""
            if [ -n "$url" ]; then
              plan_url_live "$url" || bad="$bad $wname (not downloadable)"
              plan_asset_digest_ok "$REPO" "$tag" "$wname" "$sha_win" || bad="$bad $wname (sha256 differs)"
            fi
            if [ -n "$url_mac" ]; then
              plan_url_live "$url_mac" || bad="$bad $mname (not downloadable)"
              plan_asset_digest_ok "$REPO" "$tag" "$mname" "$sha_mac" || bad="$bad $mname (sha256 differs)"
            fi
            if [ -n "$bad" ]; then
              echo "::error::$id:$bad - manifest left alone; re-run this job"
              guard_skipped="$guard_skipped $id"; continue
            fi

            plan_add "$PLAN" "$id" "$jid" "$ver" "$tag" "$url" "$sha_win" "$size_win" "$url_mac" "$sha_mac" "$size_mac"
            echo "  $jid: planned $ver"
          done

          echo "guard_skipped=${guard_skipped# }" >> $GITHUB_OUTPUT
          if [ -n "$guard_skipped" ]; then
            echo "### Release guard left alone:$guard_skipped" >> $GITHUB_STEP_SUMMARY
          fi
          if [ -s "$PLAN" ]; then
            {
              echo "### Planned versions.json entries"
              echo '```'
              cat "$PLAN"
              echo '```'
            } >> $GITHUB_STEP_SUMMARY
          else
            echo "nothing published this run - versions.json left untouched"
          fi

          # Audit R027: every installer URL a Center will follow - the ones this
          # run planned and the ones main already carries, which Commit & push
          # writes back - must be a file on this repository's releases. Anything
          # else (another host, another repository, a dot segment) stops the
          # manifest here, before anything is written.
          url_re='^https://github\.com/liranidan2000-max/rone-plugins/releases/download/[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$'
          if ! main_urls=$(jq -r '.center_installer.url, .center_installer.url_mac, (.plugins[]? | .download_url, .download_url_mac) | select(. != null)' versions.json); then
            echo "::error::versions.json on main does not parse - nothing written"
            exit 1
          fi
          plan_urls=""
          if [ -s "$PLAN" ]; then plan_urls=$(cut -d'|' -f5,8 "$PLAN" | tr '|' '\n'); fi
          bad_urls=$(printf '%s\n%s\n' "$main_urls" "$plan_urls" | grep -v '^$' | grep -Ev "$url_re" || true)
          dot_urls=$(printf '%s\n%s\n' "$main_urls" "$plan_urls" | grep -E '/\.\.?(/|$)' || true)
          if [ -n "$bad_urls$dot_urls" ]; then
            echo "::error::versions.json would name an installer that is not a file on this repository's releases - nothing written (audit R027):"
            printf '%s\n%s\n' "$bad_urls" "$dot_urls" | grep -v '^$' | sed 's/^/  /' || true
            {
              echo "### versions.json NOT updated: a download URL failed the R027 check"
              printf '%s\n%s\n' "$bad_urls" "$dot_urls" | grep -v '^$' | sed 's/^/- /' || true
            } >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
          echo "R027: $(printf '%s\n%s\n' "$main_urls" "$plan_urls" | grep -c . || true) installer URLs checked"

      - name: Commit & push
        id: push
        env:
          # guard_manifest_check reads each <Tag>-latest release's notes again.
          GH_TOKEN: ${{ github.token }}
        run: |
          RUN="${{ github.run_number }}"
          REPO="${{ github.repository }}"
          PLAN="$RUNNER_TEMP/bump-plan.txt"
          if [ ! -s "$PLAN" ]; then
            echo "push_skipped=" >> $GITHUB_OUTPUT
            echo "No changes to commit"
            exit 0
          fi
          GUARD_FETCH_ARGS=""
          GUARD_NO_RUN_COMMIT=1
          source scripts/ci/release-guard.sh
          source scripts/ci/manifest-plan.sh
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # main may have moved while this run was building (a new push, a
          # parallel run's own auto-commit, a hand edit) - #148 lost exactly this
          # race. Each attempt starts from the newest main and writes this run's
          # entries again, re-checking the guard against that main (audit R207).
          PLAN_SKIPPED=''
          if plan_commit_push "$PLAN" "$RUN" "$REPO" "ci: auto-update versions.json (build #$RUN) [skip ci]"; then
            echo "push_skipped=${PLAN_SKIPPED# }" >> $GITHUB_OUTPUT
            if [ -n "$PLAN_SKIPPED" ]; then
              echo "### Left alone on the newest main:$PLAN_SKIPPED" >> $GITHUB_STEP_SUMMARY
            fi
            echo "### Updated versions.json" >> $GITHUB_STEP_SUMMARY
            jq '.' versions.json >> $GITHUB_STEP_SUMMARY
            exit 0
          fi
          {
            echo "### versions.json NOT updated"
            echo "Release published: $(cut -d'|' -f1 "$PLAN" | tr '\n' ' ')- their versioned installers"
            echo "are up, but versions.json still names the previous builds. Re-run this job."
          } >> $GITHUB_STEP_SUMMARY
          exit 1

  # ================================================================
  # 6. VERDICT — publish first, then tell the truth about the run
  #
  # The release and manifest jobs deliberately tolerate a failed build leg so
  # that one plugin cannot hold the others hostage. That tolerance must not
  # make a broken build look fine, so this job carries the run's colour.
  # ================================================================
  verdict:
    name: Verdict
    needs: [build-windows, build-macos, release, update-manifest]
    if: '!cancelled()'
    runs-on: ubuntu-latest
    steps:
      - name: Fail if anything did not build
        run: |
          win='${{ needs.build-windows.result }}'
          mac='${{ needs.build-macos.result }}'
          rel='${{ needs.release.result }}'
          man='${{ needs.update-manifest.result }}'
          rel_skip='${{ needs.release.outputs.guard_skipped }}'
          man_skip='${{ needs.update-manifest.outputs.guard_skipped }}'
          push_skip='${{ needs.update-manifest.outputs.push_skipped }}'
          up_fail='${{ needs.release.outputs.upload_failed }}'
          alias_fail='${{ needs.release.outputs.alias_failed }}'
          echo "windows=$win macos=$mac release=$rel manifest=$man"

          # Products the version-regression guard held back (scripts/ci/release-guard.sh)
          if [ -n "$rel_skip$man_skip$push_skip" ]; then
            echo "::error::The release guard held back: ${rel_skip:-} ${man_skip:-} ${push_skip:-} - see the Release / Update versions.json logs."
            exit 1
          fi

          # Release went on past these (audit R030), so they must turn the run red here.
          if [ -n "$up_fail" ]; then
            echo "::error::Not published, an upload failed: $up_fail - versions.json kept their previous build. Re-run ALL jobs of this run to publish them ('Re-run failed jobs' would only repeat this Verdict)."
            exit 1
          fi
          if [ -n "$alias_fail" ]; then
            echo "::error::Published, but the unversioned alias was not refreshed: $alias_fail - versions.json is right; the alias (the site's Center download button) may serve the previous build or nothing. Fix by hand: upload the installer from this run's artefacts under the alias name (gh release upload <tag> <file> --clobber), or let the next release of that product refresh it. A re-run would be held back by the release guard, since the version is already live."
            exit 1
          fi

          bad=0
          for r in "$win" "$mac" "$rel" "$man"; do
            case "$r" in
              success|skipped) ;;
              *) bad=1 ;;
            esac
          done

          if [ "$bad" = "1" ]; then
            echo "::error::A leg of this run did not succeed. Whatever built was still published - re-run the failed job to finish the rest."
            exit 1
          fi
          echo "all green"
