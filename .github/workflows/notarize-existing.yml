# Notarize the Mac installers that are ALREADY released, without rebuilding them.
#
# Why (16.11.2026): Apple's notary service answered 403 "A required agreement is missing or has expired" until
# Liran signed the new Apple Developer agreement, so every Mac .pkg built in that window shipped signed but NOT
# notarized (sign-macos.sh lets a refused upload through). Notarization does not need a new build: Apple records
# the ticket against the file's hash, and Gatekeeper looks the ticket up online. Nothing is stapled here, so every
# file stays byte for byte what versions.json's sha256_mac says - no new version, no update prompt for anyone.
#
#   Actions > Notarize released Mac installers > Run workflow  (which: all | RoneHook,RoneReverb,... | center)
name: Notarize released Mac installers

on:
  workflow_dispatch:
    inputs:
      which:
        description: "all, or plugin ids from versions.json (comma separated), or center"
        required: true
        default: "all"

permissions:
  contents: read

jobs:
  notarize:
    runs-on: macos-latest
    timeout-minutes: 90
    env:
      APPLE_API_KEY_ID:        ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER_ID:     ${{ secrets.APPLE_API_ISSUER_ID }}
      APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
      WHICH:                   ${{ github.event.inputs.which }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: versions.json
          sparse-checkout-cone-mode: false

      - name: The installers versions.json points at (download_url_mac)
        shell: bash
        run: |
          python3 - <<'EOF' > "$RUNNER_TEMP/urls.txt"
          import json, os
          d = json.load(open("versions.json", encoding="utf-8"))
          want = {w.strip() for w in os.environ["WHICH"].split(",") if w.strip()}
          for p in d.get("plugins", []) + d.get("apps", []):
              u = p.get("download_url_mac")
              if u and ("all" in want or p.get("id") in want):
                  print(p["id"], u, p.get("sha256_mac", ""))
          c = d.get("center_installer") or {}
          if c.get("url_mac") and ("all" in want or "center" in want):
              print("center", c["url_mac"], c.get("sha256_mac", ""))
          EOF
          cat "$RUNNER_TEMP/urls.txt"
          [ -s "$RUNNER_TEMP/urls.txt" ] || { echo "::error::nothing matched '$WHICH'"; exit 1; }

      - name: Notarize each one (no staple - the file and its sha256 stay as released)
        shell: bash
        run: |
          set -uo pipefail
          key="$RUNNER_TEMP/AuthKey.p8"; echo "$APPLE_API_KEY_P8_BASE64" | base64 --decode > "$key"
          auth=(--key "$key" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER_ID")
          bad=0
          while read -r id url sha; do
            f="$RUNNER_TEMP/$(basename "$url")"
            curl -fsSL --retry 3 -o "$f" "$url" || { echo "::error::$id: could not download $url"; bad=1; continue; }
            got=$(shasum -a 256 "$f" | cut -d' ' -f1)
            if [ -n "$sha" ] && [ "$got" != "$sha" ]; then echo "::error::$id: sha256 $got is not versions.json's $sha"; bad=1; continue; fi
            out="$RUNNER_TEMP/$id.json"
            xcrun notarytool submit "$f" "${auth[@]}" --wait --timeout 40m --output-format json > "$out" 2>&1
            status=$(python3 -c "import json,sys; print(json.load(open(sys.argv[1])).get('status',''))" "$out" 2>/dev/null || true)
            echo "$id  $(basename "$url")  ->  ${status:-no answer}"
            case "$status" in
              Accepted) spctl -a -vvv -t install "$f" 2>&1 | sed 's/^/    gatekeeper: /' || true ;;
              *) cat "$out"; echo "::error::$id: notarization ${status:-failed}"; bad=1 ;;
            esac
            rm -f "$f"
          done < "$RUNNER_TEMP/urls.txt"
          rm -f "$key"
          exit $bad
