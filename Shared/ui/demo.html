<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RONE UI kit v2</title>
<link rel="stylesheet" href="rone-ui.css">
<style>
  /* the brand fonts from beside this folder (a plugin pastes Shared/fonts/rone-fonts.css instead) */
  @font-face{font-family:'Sora';font-weight:100 800;src:url('../fonts/sora-latin-wght-normal.woff2') format('woff2')}
  @font-face{font-family:'Manrope';font-weight:200 800;src:url('../fonts/manrope-latin-wght-normal.woff2') format('woff2')}
  @font-face{font-family:'IBM Plex Mono';font-weight:500;src:url('../fonts/ibm-plex-mono-latin-500-normal.woff2') format('woff2')}
  :root { --neon:#FF5FB8; --neon-rgb:255,95,184; }
  body { margin:0; padding:32px; background:var(--ground); color:var(--text); font-family:var(--font-ui); }
  .row { display:flex; flex-wrap:wrap; gap:18px; align-items:center; margin:0 0 26px; }
  h1 { font-size:20px; margin:0 0 6px; } p { color:var(--text2); font-size:13px; margin:0 0 26px; max-width:620px; }
  .swatches button { width:26px; height:26px; border-radius:50%; border:2px solid var(--line3); cursor:pointer; }
  .panel { padding:22px; display:flex; gap:26px; align-items:flex-end; flex-wrap:wrap; }
</style>
</head>
<body>
<h1 class="rone-display">RONE UI kit v2</h1>
<p>The knob of Reverse Reverb / Flanger, the machined keys, the gliding segment, the popover. One neon per plugin: pick one below and every part follows.</p>

<div class="row swatches" id="sw"></div>
<div class="row">
  <button class="rone-btn">Advanced</button>
  <button class="rone-btn on" data-toggle>Bypass</button>
  <button class="rone-btn hot on" data-toggle>Kill</button>
  <button class="rone-btn act wait">Waiting for MIDI</button>
  <button class="rone-btn act">Play</button>
  <button class="rone-btn" disabled>Locked</button>
  <div class="rone-preset"><button class="rone-btn arrow">◀</button><span class="nm" id="pn">Init</span><button class="rone-btn arrow">▶</button></div>
</div>
<div class="row">
  <div id="seg1"><b class="on">1/4</b><b>1/8</b><b>1/16</b><b>Free</b></div>
  <span class="rone-chip"><span class="k">BPM</span><span class="v">142</span></span>
  <span class="rone-chip"><span class="k">Tail</span><span class="v">2.3<small>s</small></span></span>
  <span id="sw1" class="on">Sync</span>
  <select id="sel1"><option>Smart</option><option>Fast</option><option>Slow</option></select>
  <button class="rone-btn dd" id="src">Source</button>
</div>
<div class="rone-panel rone-grain panel">
  <div class="rone-knobgroup"><div id="k1"></div><span class="rone-label">Attack</span></div>
  <div class="rone-knobgroup"><div id="k2"></div><span class="rone-label">Mix</span></div>
  <div class="rone-knobgroup"><div id="k3"></div><span class="rone-label">Tail</span></div>
  <div id="k4"></div>
</div>
<script src="rone-ui.js"></script>
<script>
  RoneUI.knob(document.getElementById('k1'), { size: 's', value: .3, fmt: v => (0.1 * Math.pow(500, v)).toFixed(1) + '<small>ms</small>' });
  RoneUI.knob(document.getElementById('k2'), { size: 'm', value: 1 });
  RoneUI.knob(document.getElementById('k3'), { size: 'l', value: .5, fmt: v => [1,2,4,8,16,32][Math.min(5, Math.floor(v * 6))] + '<small>bar</small>' });
  RoneUI.knob(document.getElementById('k4'), { size: 'xl', value: .5, hero: true, label: 'Intensity' });
  const s1 = document.getElementById('seg1'); RoneUI.seg(s1);
  s1.addEventListener('click', e => { const b = e.target.closest('b'); if (!b) return; s1.querySelectorAll('b').forEach(x => x.classList.toggle('on', x === b)); });
  RoneUI.switch(document.getElementById('sw1'));
  RoneUI.select(document.getElementById('sel1'));
  RoneUI.menu(document.getElementById('src'), { items: [{ t: 'This track', m: 'input', on: true }, { t: 'Master', m: 'ch 1' }, '-', { t: '+ Add a Channel…', action: true }] });
  RoneUI.menu(document.getElementById('pn'), { header: 'Presets', wide: true, items: [{ t: 'Init', on: true, star: true }, { t: 'Clean Sunrise', m: 'clean' }, { t: 'Supernova', m: 'extreme' }, '-', { t: '+ Save preset as…', action: true }], onSelect: it => { if (!it.action) document.getElementById('pn').textContent = it.t; } });
  document.querySelectorAll('[data-toggle]').forEach(b => b.addEventListener('click', () => b.classList.toggle('on')));
  const neons = { rise: '#FF5FB8', reverb: '#2BD9FF', stutter: '#FFD02B', stucker: '#9D6BFF', flanger: '#FF3E6C', grain: '#2EE6C8', gater: '#D4FF3D', delay: '#E9D6A6' };
  for (const [k, hex] of Object.entries(neons)) {
    const b = document.createElement('button'); b.title = k; b.style.background = hex;
    b.onclick = () => { const n = parseInt(hex.slice(1), 16); document.documentElement.style.setProperty('--neon', hex); document.documentElement.style.setProperty('--neon-rgb', `${n >> 16},${(n >> 8) & 255},${n & 255}`); };
    sw.appendChild(b);
  }
</script>
</body>
</html>
