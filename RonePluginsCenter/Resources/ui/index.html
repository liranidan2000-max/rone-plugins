<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RONE Plugins Center</title>
    <!-- Fonts ship inside the Center (src/main.jsx, @fontsource): no request to
         Google, and the same type offline. -->
    <style>
      /* Prevent flash of white before React hydrates (RONE graphite ground) */
      html, body { margin: 0; padding: 0; background: #14161A; overflow: hidden; }
      * { box-sizing: border-box; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
