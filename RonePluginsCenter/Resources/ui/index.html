<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RONE Plugins Center</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Sora:wght@600;700;800&display=swap" />
    <style>
      /* Prevent flash of white before React hydrates (RONE graphite ground) */
      html, body { margin: 0; padding: 0; background: #14161A; overflow: hidden; }
      * { box-sizing: border-box; }
      /* Hide scrollbar but allow scroll */
      ::-webkit-scrollbar { width: 6px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: rgba(157, 107, 255, 0.25); border-radius: 3px; }
      ::-webkit-scrollbar-thumb:hover { background: rgba(157, 107, 255, 0.45); }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
